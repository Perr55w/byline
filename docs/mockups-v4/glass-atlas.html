<!doctype html>
<html lang="en" data-theme="light">
<head>
<title>Glass Atlas · Byline v4</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap">
<style>
/* ------------------------------------------------------------------
   Tokens
   ------------------------------------------------------------------ */
@property --frost { syntax: '<length>'; inherits: false; initial-value: 26px; }

:root{
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* spacing scale (4pt) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;
  --r-tile: 24px; --r-ctl: 14px; --r-pill: 999px;

  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-io: cubic-bezier(.65, 0, .35, 1);
  --ease-glide: cubic-bezier(.2, .8, .2, 1);

  --rail-w: 232px;
  --rail-w-collapsed: 76px;

  /* Proof (light) */
  --bg: #F6F7F9;
  --ink: #0A0C10;
  --ink-2: #3E4552;
  --ink-3: #6B7280;
  --hair: rgba(12, 18, 32, .08);
  --accent: #1E5EFF;
  --accent-2: #4C86FF;
  --accent-soft: rgba(30, 94, 255, .10);
  --accent-ink: #1650E6;
  --sweep: #2F7BFF;
  --ok: #10A37F;

  --glass-bg: rgba(255, 255, 255, .60);
  --glass-bg-strong: rgba(255, 255, 255, .78);
  --glass-sat: 175%;
  --glass-edge: rgba(12, 18, 32, .07);
  --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 0 0 1px rgba(255, 255, 255, .55);
  --glass-shadow: 0 1px 1px rgba(16, 24, 40, .03), 0 6px 16px -6px rgba(16, 24, 40, .08), 0 28px 60px -24px rgba(16, 32, 72, .16);
  --glass-shadow-lift: 0 1px 1px rgba(16, 24, 40, .04), 0 12px 28px -8px rgba(16, 24, 40, .12), 0 44px 90px -30px rgba(16, 40, 96, .26);
  --sheen: rgba(255, 255, 255, .85);
  --skel: rgba(12, 18, 32, .06);
  --skel-hi: rgba(255, 255, 255, .8);
  --chip-bg: rgba(12, 18, 32, .045);
  --track: rgba(12, 18, 32, .08);
}

:root[data-theme="dark"]{
  /* Night (graphite) */
  --bg: #101114;
  --ink: #F3F4F6;
  --ink-2: #C4C8D0;
  --ink-3: #8D939E;
  --hair: rgba(255, 255, 255, .08);
  --accent: #3D7BFF;
  --accent-2: #6C9CFF;
  --accent-soft: rgba(61, 123, 255, .16);
  --accent-ink: #7AA6FF;
  --sweep: #8DB4FF;
  --ok: #34C79A;

  --glass-bg: rgba(28, 29, 33, .56);
  --glass-bg-strong: rgba(30, 31, 36, .78);
  --glass-sat: 150%;
  --glass-edge: rgba(255, 255, 255, .06);
  --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .09), inset 0 0 0 1px rgba(255, 255, 255, .045);
  --glass-shadow: 0 1px 1px rgba(0, 0, 0, .25), 0 8px 20px -8px rgba(0, 0, 0, .45), 0 30px 70px -28px rgba(0, 0, 0, .6);
  --glass-shadow-lift: 0 1px 1px rgba(0, 0, 0, .3), 0 14px 30px -10px rgba(0, 0, 0, .55), 0 50px 100px -30px rgba(0, 0, 0, .7);
  --sheen: rgba(255, 255, 255, .22);
  --skel: rgba(255, 255, 255, .06);
  --skel-hi: rgba(255, 255, 255, .14);
  --chip-bg: rgba(255, 255, 255, .06);
  --track: rgba(255, 255, 255, .09);
}

*{ box-sizing: border-box; }
html, body{ margin: 0; height: 100%; }
body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  font-feature-settings: "ss01", "cv11";
}
button{ font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }

html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after{
  transition: background-color .6s var(--ease-io), color .6s var(--ease-io), border-color .6s var(--ease-io), box-shadow .6s var(--ease-io), fill .6s var(--ease-io), stroke .6s var(--ease-io) !important;
}
html.theme-anim body{ transition: background-color .6s var(--ease-io); }

/* ------------------------------------------------------------------
   Atlas
   ------------------------------------------------------------------ */
#atlas{
  position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
  z-index: 0;
}
#pins{ position: fixed; inset: 0; z-index: 1; pointer-events: none; }
.pin{
  position: absolute; left: 0; top: 0;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-2); white-space: nowrap;
  display: flex; align-items: center; gap: 8px;
  will-change: transform, opacity; opacity: 0;
}
.pin i{ width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.pin b{ font-weight: 500; color: var(--ink-3); }

/* ------------------------------------------------------------------
   Glass
   ------------------------------------------------------------------ */
.glass{
  position: relative;
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(var(--frost)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--frost)) saturate(var(--glass-sat));
  border: 1px solid var(--glass-edge);
  box-shadow: var(--glass-hi), var(--glass-shadow);
  border-radius: var(--r-tile);
}

/* ------------------------------------------------------------------
   Rail
   ------------------------------------------------------------------ */
.rail{
  position: fixed; z-index: 20;
  left: 16px; top: 16px; bottom: 16px;
  width: var(--rail-w);
  border-radius: 26px;
  display: flex; flex-direction: column;
  padding: 18px 12px 12px;
  transition: width .42s var(--ease-glide);
  overflow: hidden;
}
.brand{
  display: flex; align-items: center; gap: 12px;
  padding: 2px 8px 22px; height: 54px;
}
.brand svg{ flex: none; }
.brand .word{
  font-family: var(--font-serif); font-size: 23px; font-weight: 500; letter-spacing: -.01em;
  font-variation-settings: "opsz" 36;
  white-space: nowrap;
}
.brand .word em{ font-style: normal; color: var(--ink-3); font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; margin-left: 8px; vertical-align: 3px; }
.nav{ display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; }
.nav-item{
  position: relative;
  display: flex; align-items: center; gap: 14px;
  height: 40px; padding: 0 14px; border-radius: 12px;
  color: var(--ink-2); white-space: nowrap; text-align: left;
  transition: color .2s, background-color .2s;
}
.nav-item svg{ flex: none; width: 20px; height: 20px; }
.nav-item:hover{ color: var(--ink); background: var(--chip-bg); }
.nav-item[aria-current="page"]{ color: var(--ink); }
.nav-item .lbl, .brand .word, .rail-foot .lbl{ transition: opacity .28s var(--ease-glide), transform .42s var(--ease-glide); }
.nav-sep{ height: 1px; background: var(--hair); margin: 10px 14px; }
.nav-glow{
  position: absolute; left: 0; right: 0; top: 0; height: 40px; border-radius: 12px;
  background: var(--glass-bg-strong);
  box-shadow: 0 0 0 1px var(--glass-edge), 0 1px 0 rgba(255,255,255,.5) inset, 0 6px 16px -8px rgba(16,32,72,.25);
  transition: transform .5s var(--ease-glide);
  pointer-events: none;
}
:root[data-theme="dark"] .nav-glow{ box-shadow: 0 0 0 1px var(--glass-edge), inset 0 1px 0 rgba(255,255,255,.06), 0 8px 18px -8px rgba(0,0,0,.6); }
.nav-glow::before{
  content: ""; position: absolute; left: -3px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--accent);
}
.nav-wrap{ position: relative; }
.rail-foot{ display: flex; flex-direction: column; gap: 4px; padding-top: 10px; border-top: 1px solid var(--hair); }
.rail-foot .nav-item svg{ transition: transform .42s var(--ease-glide); }
body.rail-collapsed{ --rail-w: var(--rail-w-collapsed); }
body.rail-collapsed .nav-item .lbl, body.rail-collapsed .brand .word, body.rail-collapsed .rail-foot .lbl{ opacity: 0; transform: translateX(-6px); pointer-events: none; }
body.rail-collapsed .rail-foot .nav-item svg{ transform: rotate(180deg); }

/* ------------------------------------------------------------------
   Stage + top controls
   ------------------------------------------------------------------ */
.stage{
  position: relative; z-index: 5;
  margin-left: calc(var(--rail-w) + 16px);
  height: 100vh;
  padding: 30px 40px 28px 28px;
  transition: margin-left .42s var(--ease-glide);
}
.topctl{
  position: absolute; z-index: 6; top: 30px; right: 40px;
  display: flex; align-items: center; gap: 10px;
}
.mobile-brand{ display: none; }
.status{
  height: 38px; padding: 0 16px 0 14px; border-radius: var(--r-pill);
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); letter-spacing: .01em;
  white-space: nowrap;
}
.status .dot{ width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
.status b{ color: var(--ink); font-weight: 500; }
.status .sep{ color: var(--ink-3); opacity: .6; }
.seg{
  height: 38px; padding: 4px; border-radius: var(--r-pill);
  display: inline-grid; grid-template-columns: 1fr 1fr; position: relative;
  font-size: 12.5px; font-weight: 500;
}
.seg button{ position: relative; z-index: 1; padding: 0 14px; border-radius: var(--r-pill); color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; transition: color .3s; }
.seg button[aria-pressed="true"]{ color: var(--ink); }
.seg .thumb{
  position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: var(--r-pill);
  background: var(--glass-bg-strong); box-shadow: 0 0 0 1px var(--glass-edge), 0 2px 8px -2px rgba(16,32,72,.2);
  transition: transform .5s var(--ease-glide);
}
:root[data-theme="dark"] .seg .thumb{ transform: translateX(100%); background: rgba(255,255,255,.1); box-shadow: 0 0 0 1px rgba(255,255,255,.06); }

.views{ position: relative; height: 100%; }
.view{ position: relative; height: 100%; display: flex; flex-direction: column; }
.view.leaving{ position: absolute; inset: 0; pointer-events: none; }

/* view header */
.vhead{ padding: 6px 0 0 8px; margin-bottom: 28px; }
.eyebrow{
  font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3);
  display: flex; gap: 10px; align-items: center;
}
.eyebrow .accent{ color: var(--accent-ink); }
h1.headline{
  font-family: var(--font-serif); font-weight: 420; font-size: 54px; line-height: 1.04; letter-spacing: -.022em;
  font-variation-settings: "opsz" 72;
  margin: 22px 0 0; max-width: 24ch;
  text-wrap: balance;
}
h1.headline em{ font-style: italic; font-weight: 380; color: var(--ink-2); }
.dek{ margin: 14px 0 0; color: var(--ink-2); font-size: 16.5px; line-height: 1.5; max-width: 80ch; }
.dek b{ font-weight: 550; color: var(--ink); }

/* ------------------------------------------------------------------
   Heading entrance: "lens sweep" — a band of light travels across the
   line and pulls each word into focus as it passes.
   ------------------------------------------------------------------ */
.lens .w{
  display: inline-block;
  background-image: linear-gradient(100deg, var(--ink) 0 36%, var(--sweep) 47%, color-mix(in srgb, var(--sweep) 40%, white) 50%, var(--sweep) 53%, var(--ink) 64% 100%);
  background-size: 280% 100%;
  background-position: 100% 0;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  padding-bottom: .06em; margin-bottom: -.06em;
}
.lens em .w{ background-image: linear-gradient(100deg, var(--ink-2) 0 36%, var(--sweep) 47%, color-mix(in srgb, var(--sweep) 40%, white) 50%, var(--sweep) 53%, var(--ink-2) 64% 100%); }
.lens.play .w{ animation: lens 1.25s var(--ease-out) var(--d, 0ms) both; }
@keyframes lens{
  0%  { opacity: 0; filter: blur(14px); transform: translate3d(0, .1em, 0) scale(1.02); background-position: 100% 0; letter-spacing: .02em; }
  38% { opacity: 1; filter: blur(0); }
  100%{ opacity: 1; filter: blur(0); transform: none; background-position: 0% 0; letter-spacing: normal; }
}
.rise{ opacity: 0; }
.rise.play{ animation: rise .9s var(--ease-out) var(--d, 0ms) both; }
@keyframes rise{ from{ opacity: 0; transform: translateY(8px); filter: blur(6px);} to{ opacity: 1; transform: none; filter: blur(0);} }

/* ------------------------------------------------------------------
   Today grid
   ------------------------------------------------------------------ */
.grid{
  flex: 1; min-height: 0;
  display: grid; gap: 20px;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.08fr);
  grid-template-areas:
    "lead lead lead lead lead lead lead s1 s1 s1 s1 s1"
    "lead lead lead lead lead lead lead s2 s2 s2 s2 s2"
    "map  map  map  map  map  map  map  wk wk wk wk wk";
}
.tile{
  padding: 26px 28px;
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  transform: perspective(1100px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform .6s var(--ease-glide), box-shadow .6s var(--ease-glide);
}
.tile::after{
  /* pointer sheen + load light sweep */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(420px circle at var(--px, 50%) var(--py, -40%), var(--sheen), transparent 60%);
  opacity: 0; transition: opacity .5s var(--ease-glide);
  mix-blend-mode: soft-light;
}
.tile.hover{ box-shadow: var(--glass-hi), var(--glass-shadow-lift); }
.tile.hover::after{ opacity: 1; }
.tile .sweep{
  position: absolute; inset: 0; border-radius: inherit; pointer-events: none; overflow: hidden;
}
.tile .sweep::before{
  content: ""; position: absolute; top: -20%; bottom: -20%; width: 40%; left: -60%;
  background: linear-gradient(100deg, transparent, var(--sheen) 50%, transparent);
  opacity: .0; transform: skewX(-12deg);
}
.tile.sheen .sweep::before{ animation: sheen 1.3s var(--ease-io) var(--sd, 0ms) both; }
@keyframes sheen{ 0%{ left: -60%; opacity: 0;} 20%{opacity: .55;} 100%{ left: 130%; opacity: 0;} }
:root[data-theme="dark"] .tile.sheen .sweep::before{ animation-name: sheenDark; }
@keyframes sheenDark{ 0%{ left: -60%; opacity: 0;} 20%{opacity: .35;} 100%{ left: 130%; opacity: 0;} }

.t-label{
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3);
  display: flex; align-items: center; gap: 10px;
}
.t-label .k{ color: var(--ink-2); }
.chip{
  display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: var(--r-pill);
  background: var(--chip-bg); color: var(--ink-2); font-size: 12px; font-weight: 500; white-space: nowrap;
}
.chip.accent{ background: var(--accent-soft); color: var(--accent-ink); }

/* lead */
.lead{ grid-area: lead; cursor: pointer; padding: 30px 34px 28px; }
.lead .top{ padding-right: 130px; }
.lead .ring{ position: absolute; top: 26px; right: 28px; }
.lead .chips{ display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.lead h2{
  font-family: var(--font-serif); font-weight: 450; font-size: clamp(34px, 3vw, 44px); line-height: 1.05; letter-spacing: -.02em;
  font-variation-settings: "opsz" 60;
  margin: 22px 0 0; max-width: 19ch; text-wrap: balance;
}
.lead .sum{ margin: 16px 0 0; font-size: 16px; color: var(--ink-2); max-width: 54ch; }
.lead .why{ margin-top: auto; padding-top: 16px; }
.lead .why p{ margin: 8px 0 0; font-size: 15px; text-wrap: pretty; line-height: 1.55; color: var(--ink); max-width: 62ch; }
.lead .why p .mute{ color: var(--ink-3); }
.lead .foot{
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hair);
  font-size: 13px; color: var(--ink-2);
}
.srcs{ display: flex; align-items: center; gap: 12px; }
.stack{ display: flex; }
.stack span{
  width: 24px; height: 24px; border-radius: 50%; margin-left: -6px; display: grid; place-items: center;
  background: var(--glass-bg-strong); box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 2.5px var(--glass-edge);
  font-family: var(--font-mono); font-size: 10px; color: var(--ink-2); font-weight: 600;
}
.stack span:first-child{ margin-left: 0; background: var(--accent); color: #fff; }
.cta{ display: inline-flex; align-items: center; gap: 8px; color: var(--accent-ink); font-weight: 550; }
.cta svg{ transition: transform .4s var(--ease-glide); }
.lead:hover .cta svg{ transform: translateX(3px); }

/* score ring */
.ring{ position: relative; width: 108px; height: 108px; flex: none; }
.ring svg{ position: absolute; inset: 0; transform: rotate(-90deg); }
.ring .track{ stroke: var(--track); }
.ring .bar{ stroke: var(--accent); stroke-linecap: round; }
.ring .tick{ stroke: var(--ink-3); }
.ring .num{
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  font-family: var(--font-mono); font-size: 34px; font-weight: 500; letter-spacing: -.04em; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.ring .num small{ display: block; font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3); font-weight: 500; margin-top: 6px; }

/* secondary */
.sec{ padding: 22px 26px; }
.s1{ grid-area: s1; } .s2{ grid-area: s2; }
.sec .row{ display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
.sec h3{
  font-family: var(--font-serif); font-weight: 460; font-size: 21.5px; line-height: 1.18; letter-spacing: -.012em;
  font-variation-settings: "opsz" 30;
  margin: 12px 0 0; text-wrap: pretty;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.mini{ text-align: right; flex: none; }
.mini .n{ font-family: var(--font-mono); font-size: 30px; font-weight: 500; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.meter{ position: relative; width: 74px; height: 3px; border-radius: 3px; background: var(--track); margin-top: 10px; margin-left: auto; overflow: visible; }
.meter i{ position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); width: 0; }
.meter b{ position: absolute; top: -3px; bottom: -3px; width: 1.5px; background: var(--ink-3); left: 60%; }
.sec .meta{ margin-top: auto; padding-top: 12px; font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.sec .meta .dotsep{ color: var(--ink-3); }

/* map tile */
.maptile{ grid-area: map; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 26px; padding: 22px 26px; }
.maptile .mm{ position: relative; border-radius: 16px; overflow: hidden; background: var(--chip-bg); box-shadow: inset 0 0 0 1px var(--hair); min-height: 0; }
.maptile .mm svg{ position: absolute; inset: 0; width: 100%; height: 100%; }
.mm .grat{ stroke: var(--hair); }
.mm .blob{ fill: var(--accent); transition: opacity .4s; }
.mm .blob-ring{ fill: none; stroke: var(--accent); stroke-opacity: .35; }
.mm .vp{ fill: none; stroke: var(--ink); stroke-opacity: .5; stroke-dasharray: .035 .025; }
.mm text{ font-family: var(--font-mono); font-size: .066px; fill: var(--ink-2); letter-spacing: .04em; text-transform: uppercase; }
.legend{ display: flex; flex-direction: column; min-height: 0; }
.legend h4{ margin: 10px 0 2px; font-family: var(--font-serif); font-weight: 460; font-size: 22px; letter-spacing: -.01em; font-variation-settings: "opsz" 30; line-height: 1.15; }
.legend .note{ font-size: 12.5px; color: var(--ink-3); margin-bottom: 10px; }
.lg-list{ display: flex; flex-direction: column; gap: 2px; margin-top: auto; }
.lg{
  display: grid; grid-template-columns: 1fr 70px 22px; align-items: center; gap: 12px;
  height: 27px; padding: 0 8px; margin: 0 -8px; border-radius: 8px; font-size: 13px; color: var(--ink-2); text-align: left;
  transition: background-color .2s, color .2s;
}
.lg:hover, .lg.on{ background: var(--chip-bg); color: var(--ink); }
.lg .bar{ height: 4px; border-radius: 4px; background: var(--track); position: relative; overflow: hidden; }
.lg .bar i{ position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }
.lg .c{ font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); text-align: right; }

/* week */
.week{ grid-area: wk; padding: 22px 26px; }
.week .head{ display: flex; justify-content: space-between; align-items: baseline; }
.week h4{ margin: 10px 0 0; font-family: var(--font-serif); font-weight: 460; font-size: 22px; letter-spacing: -.01em; font-variation-settings: "opsz" 30; line-height: 1.15; }
.posts{ margin-top: auto; display: flex; flex-direction: column; }
.post{ display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center; padding: 11px 0; border-top: 1px solid var(--hair); }
.post .d{ font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

/* entrance state for pieces */
.piece{ will-change: transform, opacity, filter; }

/* ------------------------------------------------------------------
   Skeleton (frosted placeholders shaped like the tiles)
   ------------------------------------------------------------------ */
.skel-layer{ position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; z-index: 2; }
.skel-layer .vhead{ visibility: visible; }
.skel{ --frost: 16px; background: color-mix(in srgb, var(--glass-bg) 70%, transparent); padding: 28px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }

.sk::after{
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, var(--skel-hi), transparent);
  transform: translateX(-100%); animation: shimmer 1.1s var(--ease-io) infinite;
}
@keyframes shimmer{ to{ transform: translateX(100%); } }
.sk.line{ height: 12px; }
.sk.h{ height: 30px; border-radius: 10px; }

/* ------------------------------------------------------------------

   ------------------------------------------------------------------ */

.bar-line::before, .bar-line::after{ content: ""; height: 1px; flex: 1; background: var(--hair); }

.ph{ flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; grid-template-rows: minmax(0,1fr); }

  .nav-glow{ height: 54px; width: 20%; }

  .dek{ font-size: 15px; }
  .views, .view{ height: auto; }

  .tile{ padding: 20px; }
  .lead{ padding: 22px 20px; min-height: 0; }
  .lead h2{ font-size: 31px; margin-top: 18px; }
  .lead .sum{ font-size: 15px; }
  .ring{ width: 76px; height: 76px; }
  .lead .ring{ top: 18px; right: 18px; }
  .ring .num{ font-size: 24px; }
  .ring .num small{ font-size: 8px; margin-top: 3px; }
  .lead .top{ padding-right: 86px; }
  .lead .why{ padding-top: 18px; }
  .lead .t-label{ white-space: nowrap; }
  .lead .t-label span:not(.k){ display: none; }
  .sec h3{ -webkit-line-clamp: 3; }
  .sec .meta{ display: block; }
  .sec .meta .dotsep{ margin: 0 4px; }
  .maptile{ grid-template-columns: 1fr; gap: 16px; }
  .maptile .mm{ height: 170px; }
  .sec h3{ font-size: 21px; }
  .sec .meta{ padding-top: 16px; }
  .post .tt{ white-space: normal; }
  .frow{ grid-template-columns: 44px minmax(0,1fr); gap: 14px; padding: 14px 12px; }
  .frow .tp, .frow .sr{ display: none; }
  .frow .sc{ font-size: 20px; }
  .frow .tt{ font-size: 17px; }
  .listpanel{ overflow: visible; }
  .ph{ grid-template-columns: 1fr; }
  .ph .tile{ min-height: 220px; }
  .dossier{ border-radius: 22px; }
  .dz{ padding: 22px 20px 32px; }
  .dz h2{ font-size: 34px; }

  .ev{ grid-template-columns: 1fr; gap: 6px; }
  .skel-layer .grid > :nth-child(n+3){ display: none; }
}

/* short desktop windows: let the page scroll instead of crushing tiles */
@media (min-width: 761px) and (max-height: 780px){
  body{ overflow-y: auto; }
  .stage{ height: auto; min-height: 100vh; }
  .views, .view{ height: auto; }
  .grid{ height: 640px; flex: none; }
  .listpanel{ max-height: 640px; flex: none; }
  .ph{ height: 560px; flex: none; }
}

@media (prefers-reduced-motion: reduce){
  .sk::after{ animation: none; }
  .lens.play .w, .rise.play{ animation: none; opacity: 1; }
  .rise{ opacity: 1; }
  .tile, .rail, .stage, .nav-glow, .seg .thumb{ transition: none !important; }
}

<script src="data.js"></script>
<script>
(() => {
'use strict';
const D = window.BYLINE_DATA;
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isPhone = () => matchMedia('(max-width: 760px)').matches;

/* cubic-bezier solver (for camera easing that matches the CSS curves) */
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t;
  const dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 6; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-5 || !d) break; t -= e / d; }
    return sy(clamp(t, 0, 1));
  };
}
const easeLoad = bezier(.55, 0, .1, 1);
const easeCam = bezier(.65, 0, .25, 1);
const easeOutExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);

/* ------------------------------------------------------------------
   Data shaping
   ------------------------------------------------------------------ */
const stories = [...D.stories].sort((a, b) => b.score - a.score);
const above = stories.filter(s => s.score >= D.threshold);
const lead = above[0];
const secondaries = above.slice(1, 3);
const NUM = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];
const runDate = new Date(D.ranAt);
const ranAt = runDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const dayLabel = new Date(D.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

function parseWhy(w) {
  const r = { topics: [], watch: [], credible: 0, primary: false, research: false, commentary: 0, signals: [], post: [], deemph: null };
  for (const p of w.split(' · ')) {
    if (p.startsWith('Matches ')) r.topics = p.slice(8).split(';').map(x => x.trim().replace(/\s*\(.*\)$/, ''));
    else if (p.startsWith('watchlist:')) r.watch = p.slice(10).split(/,\s(?=[A-Z])/).map(s => s.trim());
    else if (/credible independent source/.test(p)) {
      r.credible = parseInt(p, 10) || 0; r.primary = /primary announcement/.test(p); r.research = /research/.test(p);
      const m = p.match(/\+(\d+) commentary/); if (m) r.commentary = +m[1];
    }
    else if (p.startsWith('practical signals:')) r.signals = p.slice(18).split(',').map(s => s.trim());
    else if (p.startsWith('post-worthy:')) r.post = p.slice(12).split(',').map(s => s.trim());
    else if (p.startsWith('de-emphasized')) r.deemph = p.replace(/^de-emphasized\s*/, '');
  }
  return r;
}
const lcTopic = t => /^[A-Z]{2}/.test(t) ? t : t.charAt(0).toLowerCase() + t.slice(1);
const joinList = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const watchShort = q => /measuring whether AI agents/i.test(q) ? 'how teams measure agent outcomes' : q.replace(/\?$/, '').replace(/^\w/, c => c.toLowerCase());
function plainWhy(s, short = false) {
  const r = parseWhy(s.why);
  const parts = [];
  let a = `Sits squarely on ${joinList(r.topics.map(lcTopic))}`;
  if (r.watch.length) a += `, and answers your watchlist question on ${watchShort(r.watch[0])}`;
  parts.push(a + '.');
  if (r.credible === 0) parts.push('No independent confirmation yet.');
  else parts.push(`${NUM[r.credible] || r.credible} credible source${r.credible > 1 ? 's' : ''}${r.primary ? ', including the primary announcement' : ''}${r.research ? ', backed by research' : ''}.`);
  const PW = { 'testable': 'testable', 'changes a process': 'process-changing', 'checkable numbers': 'backed by numbers you can check', 'challenges a claim': 'a challenge to a popular claim' };
  if (r.post.length && !short) parts.push(`Worth a post: it is ${joinList(r.post.slice(0, 3).map(x => PW[x] || x))}.`);
  return parts.join(' ');
}
function shortWhy(s) {
  const r = parseWhy(s.why);
  const bits = [];
  bits.push(r.credible ? `${r.credible} independent source${r.credible > 1 ? 's' : ''}` : 'unconfirmed');
  if (r.signals.length) bits.push(r.signals.slice(0, 2).join(', '));
  return bits.join(' · ');
}
function breakdown(s) {
  const r = parseWhy(s.why);
  const raw = [
    ['Topic fit', Math.min(r.topics.length, 3) * 8 + 4],
    ['Watchlist', Math.min(r.watch.length, 3) * 6],
    ['Evidence', r.credible * 7 + (r.primary ? 5 : 0) + (r.research ? 5 : 0) + r.commentary * 2],
    ['Practical signals', r.signals.length * 3],
    ['Post-worthiness', r.post.length * 3],
  ];
  const sum = raw.reduce((a, b) => a + b[1], 0) || 1;
  const out = raw.map(([k, v]) => [k, Math.round(v / sum * s.score)]);
  const diff = s.score - out.reduce((a, b) => a + b[1], 0);
  out.sort((a, b) => b[1] - a[1]); out[0][1] += diff;
  return out;
}

/* topic heat: scores of today's stories, weighted toward the strong ones */
const topics = D.topics.map((name, i) => ({ name, i, heat: 0, count: 0, above: 0 }));
const tIndex = Object.fromEntries(topics.map(t => [t.name, t]));
for (const s of stories) {
  const w = Math.pow(Math.max(0, s.score - 25) / 75, 1.6);
  s.topics.forEach((t, k) => { const T = tIndex[t]; if (!T) return; T.heat += w * (k === 0 ? 1 : .62); T.count++; if (s.score >= D.threshold) T.above++; });
}
const maxHeat = Math.max(...topics.map(t => t.heat));
topics.forEach(t => { t.heat = t.heat / maxHeat; });
const byHeat = [...topics].sort((a, b) => b.heat - a.heat);

/* layout: topics that co-occur sit near each other (small force layout, deterministic) */
(function layout() {
  const n = topics.length, co = Array.from({ length: n }, () => new Array(n).fill(0));
  for (const s of stories) for (const a of s.topics) for (const b of s.topics) if (a !== b && tIndex[a] && tIndex[b]) co[tIndex[a].i][tIndex[b].i] += s.score / 100;
  const P = topics.map((t, i) => { const a = i / n * Math.PI * 2 + .4; return { x: Math.cos(a) * 1.1, y: Math.sin(a) * .7 }; });
  for (let it = 0; it < 420; it++) {
    const cool = 1 - it / 420;
    for (let i = 0; i < n; i++) {
      let fx = 0, fy = 0;
      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const dx = P[i].x - P[j].x, dy = P[i].y - P[j].y, d = Math.hypot(dx, dy) + 1e-3;
        const rep = .07 / (d * d);
        const att = co[i][j] * .022 * d;
        fx += dx / d * (rep - att); fy += dy / d * (rep - att);
      }
      fx -= P[i].x * .015; fy -= P[i].y * .03;
      P[i].x += fx * cool * .6; P[i].y += fy * cool * .6;
    }
  }
  const xs = P.map(p => p.x), ys = P.map(p => p.y);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const sx = 1.25 / (Math.max(...xs) - cx || 1), sy = .62 / (Math.max(...ys) - cy || 1);
  topics.forEach((t, i) => {
    t.x = (P[i].x - cx) * sx; t.y = (P[i].y - cy) * sy;
    t.r = .15 + .27 * Math.sqrt(t.heat);
    t.depth = .55 + (1 - t.heat) * .9; // cooler topics sit further back
  });
})();

/* ------------------------------------------------------------------
   Atlas renderer — WebGL2 with a Canvas2D fallback
   ------------------------------------------------------------------ */
const canvas = $('#atlas');
const cam = { x: WIDE.x, y: WIDE.y, z: WIDE.z };
const ptr = { x: 0, y: 0, tx: 0, ty: 0 };
let themeMix = 0, themeTarget = 0;
let hiIndex = -1, hiAmt = 0, hiTarget = 0;
let dimAmt = 0, dimTarget = 0;
let camTween = null;

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform vec3 uCam; uniform vec2 uPtr;
uniform float uDark; uniform vec4 uT[8]; uniform float uDep[8];
uniform float uHi; uniform float uHiAmt; uniform float uOct; uniform float uDim;
out vec4 o;
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);

vec3 ramp(float h, float dark){
  vec3 lo = mix(vec3(.60,.67,.78), vec3(.34,.41,.53), dark);
  vec3 mi = mix(vec3(.45,.68,1.0), vec3(.27,.53,1.0), dark);
  vec3 hi = mix(vec3(.10,.36,1.0), vec3(.24,.48,1.0), dark);

}
void main(){
  vec2 uv = (gl_FragCoord.xy - .5*uRes) / uRes.y;
  vec2 w = uv / uCam.z + uCam.xy;
  float t = uTime * .018;
  vec2 q = vec2(fbm(w*1.5 + vec2(t, 0.)), fbm(w*1.5 + vec2(5.2, 1.3) - vec2(0., t*.8)));
  vec2 ww = w + (q - .5) * .42;
  float F = 0.; vec3 tint = vec3(0.); float hi = 0.;
  for (int i = 0; i < 8; i++){
    vec4 T = uT[i];
    vec2 c = T.xy + uPtr * uDep[i] * .06 / uCam.z;
    float d = length(ww - c) / T.z;
    float f = (.35 + .65*T.w) * exp(-d*d*1.7);

  vec2 g = vec2(dFdx(F), dFdy(F)) * uRes.y * .35;

  float grat = 1. - min(min(gg.x, gg.y), 1.);

  vec3 baseL = mix(vec3(.976, .980, .988), vec3(.93, .945, .965), smoothstep(.2, 1.2, length(uv)));

  colL = mix(colL, vec3(.35, .42, .55), grat * .06);
  colL = mix(colL, vec3(.12, .37, 1.), hi * uHiAmt * .35);

  // dark (Night graphite)
  vec3 baseD = mix(vec3(.071, .075, .086), vec3(.047, .051, .058), smoothstep(.2, 1.2, length(uv)));
  vec3 colD = baseD + tint * mask * .30 * (.55 + .7*diff);
  colD += tint * spot * mask * .14;
  colD = mix(colD, vec3(.45, .63, 1.), line * (.12 + .1*major));
  colD = mix(colD, vec3(.6, .65, .75), grat * .045);
  colD += vec3(.25, .45, 1.) * hi * uHiAmt * .25;

  vec3 col = mix(colL, colD, uDark);
  col = mix(col, mix(vec3(.976,.98,.988), vec3(.06,.064,.072), uDark), uDim * .35);
  col += (hash(gl_FragCoord.xy + fract(uTime)) - .5) / 255. * 1.5;

  const walk = node => {
    [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) {
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(part => {
          if (!part) return;
          if (/^\s+$/.test(part)) frag.appendChild(document.createTextNode(part));
          else { const s = el('span', 'w'); s.textContent = part; frag.appendChild(s); }
        });
        n.replaceWith(frag);
      } else if (n.nodeType === 1) walk(n);
    });
  };
  walk(root);
}
/* signature heading entrance: words focus in as a light band sweeps across them */
function playHeading(head, base = 0) {
  const h = head.querySelector('.lens');
  if (!h) return;
  if (!h.querySelector('.w')) splitWords(h);
  const words = [...h.querySelectorAll('.w')];
  const W = h.offsetWidth || 1;
  const tops = [...new Set(words.map(w => w.offsetTop))].sort((a, b) => a - b);
  words.forEach(w => {
    const line = tops.indexOf(w.offsetTop);
    w.style.setProperty('--d', Math.round(base + 60 + (w.offsetLeft / W) * 520 + line * 170) + 'ms');
  });
  h.classList.remove('play'); h.offsetWidth; h.classList.add('play');
  const ey = head.querySelector('.eyebrow'), dk = head.querySelector('.dek');
  if (ey) { ey.style.setProperty('--d', base + 'ms'); ey.classList.remove('play'); ey.offsetWidth; ey.classList.add('play'); }
  if (dk) { dk.style.setProperty('--d', (base + 520 + tops.length * 170) + 'ms'); dk.classList.remove('play'); dk.offsetWidth; dk.classList.add('play'); }
}

function countUp(node, to, dur, delay, onTick) {
  if (REDUCED) { node.textContent = to; onTick && onTick(1); return; }
  node.textContent = '0';
  const start = performance.now() + delay;
  const step = now => {
    const k = clamp((now - start) / dur, 0, 1), e = easeOutExpo(k);
    node.textContent = k >= 1 ? to : Math.floor(to * e);
    onTick && onTick(k >= 1 ? 1 : e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

    <line class="tick" x1="${tx1.toFixed(1)}" y1="${ty1.toFixed(1)}" x2="${tx2.toFixed(1)}" y2="${ty2.toFixed(1)}" stroke-width="1.5"/>

/* ------------------------------------------------------------------
   Tile hover: subtle depth tilt + pointer sheen
   ------------------------------------------------------------------ */
function bindTilt(root) {
  if (REDUCED || matchMedia('(hover: none)').matches) return;
  root.querySelectorAll('.tile').forEach(t => {
    let raf = 0, last = null;
    t.addEventListener('pointerenter', () => t.classList.add('hover'));
    t.addEventListener('pointermove', e => {
      last = e;
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const r = t.getBoundingClientRect();
        const px = (last.clientX - r.left) / r.width, py = (last.clientY - r.top) / r.height;
        const k = Math.min(1, 520 / Math.max(r.width, r.height));
        t.style.setProperty('--ry', ((px - .5) * 3.2 * k).toFixed(2) + 'deg');
        t.style.setProperty('--rx', ((.5 - py) * 2.6 * k).toFixed(2) + 'deg');
        t.style.setProperty('--px', (px * 100).toFixed(1) + '%');
        t.style.setProperty('--py', (py * 100).toFixed(1) + '%');
      });
    });
    t.addEventListener('pointerleave', () => { t.classList.remove('hover'); t.style.setProperty('--rx', '0deg'); t.style.setProperty('--ry', '0deg'); });
  });
}

/* ------------------------------------------------------------------
   Condense: glass tiles settle onto the screen (depth -> plane, blur -> sharp,
   frost grows from clear glass)
   ------------------------------------------------------------------ */
function condense(pieces, base, opts = {}) {
  const dx = opts.dx || 0, dy = opts.dy || 0;
  pieces.forEach((p, i) => {
    const d = base + i * (opts.stagger ?? 80);
    if (REDUCED) return;
    p.animate([
      { opacity: 0, filter: 'blur(18px)', translate: `${dx}px ${dy + 18}px`, scale: 1.06, '--frost': '0px' },
      { opacity: 1, offset: .45 },
      { opacity: 1, filter: 'blur(0px)', translate: '0px 0px', scale: 1, '--frost': '26px' },
    ], { duration: opts.dur || 1000, delay: d, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' });
    if (opts.sheen && p.classList.contains('tile')) {
      p.style.setProperty('--sd', (d + 380) + 'ms');
      p.classList.remove('sheen'); p.offsetWidth; p.classList.add('sheen');
    }
  });
}
function release(pieces, opts = {}) {
  const dx = opts.dx || 0, dy = opts.dy || 0;
  return Promise.all(pieces.map((p, i) => p.animate([
    { opacity: 1, filter: 'blur(0px)', translate: '0px 0px', scale: 1 },
    { opacity: 0, filter: 'blur(12px)', translate: `${dx}px ${dy}px`, scale: .955 },
  ], { duration: opts.dur || 460, delay: i * 30, easing: 'cubic-bezier(.55,0,.75,.3)', fill: 'forwards' }).finished.catch(() => {})));
}
function runScores(root, base) {
  root.querySelectorAll('.cu').forEach((n, i) => {
    const to = +n.dataset.to;
    const ring = n.closest('.ring');
    const meter = n.closest('.sec')?.querySelector('.meter i');
    const bar = ring?.querySelector('.bar');
    const c = bar ? +bar.dataset.c : 0;
    countUp(n, to, ring ? 1700 : 1400, base + i * 90, e => {
      const v = to * e;
      if (bar) bar.style.strokeDashoffset = (c * (1 - v / 100)).toFixed(2);
      if (meter) meter.style.width = v + '%';
    });
  });
}

/* ------------------------------------------------------------------
   Navigation (camera move + panel exchange)
   ------------------------------------------------------------------ */
const viewsEl = $('#views');
let activeView = null, busy = false;
function go(name) {
  if (name === current || busy) return;
  if (dossierOpen) closeDossier(true);
  const from = REGION[current] || REGION.Today, to = REGION[name] || REGION.Today;
  current = name;
  nav.querySelectorAll('.nav-item').forEach(b => b.toggleAttribute('aria-current', false));
  const btn = nav.querySelector(`[data-view="${name}"]`); btn && btn.setAttribute('aria-current', 'page');
  placeGlow();
  // direction of travel in screen space: panels drift opposite to the camera, like the world moving past
  let vx = (to.x - from.x), vy = -(to.y - from.y);
  const len = Math.hypot(vx, vy) || 1; vx /= len; vy /= len;
  const out = activeView;
  const next = buildView(name);
  busy = true;
  hiTarget = 0;
  flyTo({ ...to }, REDUCED ? 0 : 880, easeCam, .16);
  if (REDUCED) { out && out.remove(); viewsEl.appendChild(next); activeView = next; bindTilt(next); busy = false; runScores(next, 0); return; }
  out.classList.add('leaving');
  release([...out.querySelectorAll('.piece')], { dx: -vx * 70, dy: -vy * 50, dur: 440 }).then(() => out.remove());
  viewsEl.appendChild(next); activeView = next;
  const pieces = [...next.querySelectorAll('.piece')];
  playHeading(next.querySelector('.vhead'), 200);
  condense(pieces.filter(p => !p.classList.contains('vhead')), 240, { dx: vx * 90, dy: vy * 60, dur: 880, stagger: 60 });
  runScores(next, 520);
  bindTilt(next);
  setTimeout(() => { busy = false; }, 560);
  if (isPhone()) scrollTo({ top: 0, behavior: 'smooth' });
}

function setBox(b) { Object.assign(dossier.style, { left: b.left + 'px', top: b.top + 'px', width: b.width + 'px', height: b.height + 'px' }); }
function openDossier(src) {
  if (dossierOpen || busy) return;
  dossierOpen = true; dossierSrc = src;
  const r = src.getBoundingClientRect();
  const from = { left: r.left, top: r.top, width: r.width, height: r.height };
  const to = dossierTarget();
  dossier.innerHTML = dossierHTML(lead);
  setBox(to);
  dossier.classList.add('open');
  dossier.querySelector('.close').addEventListener('click', () => closeDossier());
  const others = [...activeView.querySelectorAll('.piece')].filter(p => p !== src);
  // camera dollies toward the lead's topic region
  const lt = tIndex[lead.topics[0]];
  flyTo({ x: lt.x + .12, y: lt.y, z: 1.75 }, REDUCED ? 0 : 900, easeCam, .05);
  dimTarget = 1;
  if (REDUCED) { src.style.opacity = 0; finishOpen(); return; }
  const dur = 720, ease = 'cubic-bezier(.2,.8,.2,1)';
  dossier.animate([
    { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px', borderRadius: '24px' },
    { left: to.left + 'px', top: to.top + 'px', width: to.width + 'px', height: to.height + 'px', borderRadius: '28px' },
  ], { duration: dur, easing: ease });
  // shared title: FLIP from the tile title to the dossier title
  const srcT = src.querySelector('.lt'), dt = dossier.querySelector('.dt');
  const a = srcT.getBoundingClientRect(), b = dt.getBoundingClientRect();
  const sc = parseFloat(getComputedStyle(srcT).fontSize) / parseFloat(getComputedStyle(dt).fontSize);
  dt.animate([
    { transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${sc})` },
    { transform: 'none' },
  ], { duration: dur, easing: ease });
  src.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' });
  others.forEach(p => p.animate([{ opacity: 1, filter: 'blur(0px)', scale: 1 }, { opacity: 0, filter: 'blur(8px)', scale: .97 }], { duration: 420, easing: ease, fill: 'forwards' }));
  dossier.querySelectorAll('.dz-in').forEach((n, i) => n.animate([{ opacity: 0, transform: 'translateY(14px)', filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0px)' }], { duration: 700, delay: 300 + i * 70, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'both' }));
  setTimeout(finishOpen, 380);
}
function finishOpen() {
  dossier.querySelectorAll('.dz-in').forEach(n => { if (REDUCED) n.style.opacity = 1; });
  const n = dossier.querySelector('.dcu');
  countUp(n, lead.score, 1500, 0);
  const th = dossier.querySelector('.thresh i'); requestAnimationFrame(() => th.style.width = lead.score + '%');
  dossier.querySelectorAll('.bd .bar i').forEach((b, i) => setTimeout(() => b.style.width = b.dataset.w + '%', i * 70));
  dossier.querySelector('.close').focus({ preventScroll: true });
}
function closeDossier(instant = false) {
  if (!dossierOpen) return;
  dossierOpen = false;
  const src = dossierSrc;
  const others = activeView ? [...activeView.querySelectorAll('.piece')].filter(p => p !== src) : [];
  dimTarget = 0;
  const done = () => {
    dossier.classList.remove('open'); dossier.innerHTML = '';
    if (src) { src.getAnimations().forEach(a => a.cancel()); src.style.opacity = ''; src.focus({ preventScroll: true }); }
    others.forEach(p => p.getAnimations().forEach(a => a.cancel()));
  };
  if (instant || REDUCED || !src || !src.isConnected) { if (!instant) flyTo({ ...REGION[current] }, 0, easeCam, 0); done(); return; }
  flyTo({ ...REGION[current] }, 820, easeCam, .05);
  const r = src.getBoundingClientRect(), cur = dossier.getBoundingClientRect();
  const ease = 'cubic-bezier(.4,0,.1,1)';
  dossier.querySelectorAll('.dz-in').forEach(n => n.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' }));
  const anim = dossier.animate([
    { left: cur.left + 'px', top: cur.top + 'px', width: cur.width + 'px', height: cur.height + 'px', borderRadius: '28px', opacity: 1 },
    { opacity: 1, offset: .8 },
    { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', borderRadius: '24px', opacity: 0 },
  ], { duration: 620, easing: ease, fill: 'forwards' });
  const dt = dossier.querySelector('.dt'), srcT = src.querySelector('.lt');
  const b = dt.getBoundingClientRect(), a = srcT.getBoundingClientRect();
  const sc = parseFloat(getComputedStyle(srcT).fontSize) / parseFloat(getComputedStyle(dt).fontSize);
  dt.animate([{ transform: 'none' }, { transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${sc})` }], { duration: 620, easing: ease, fill: 'forwards' });
  src.getAnimations().forEach(a2 => a2.cancel());
  src.animate([{ opacity: 0 }, { opacity: 0, offset: .55 }, { opacity: 1 }], { duration: 620, easing: 'linear' });
  others.forEach(p => { p.getAnimations().forEach(a2 => a2.cancel()); p.animate([{ opacity: 0, filter: 'blur(8px)', scale: .97 }, { opacity: 1, filter: 'blur(0px)', scale: 1 }], { duration: 600, delay: 120, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' }); });
  anim.finished.then(done).catch(done);
}
addEventListener('keydown', e => { if (e.key === 'Escape' && dossierOpen) closeDossier(); });

/* ------------------------------------------------------------------
   Skeleton -> signature load sequence
   ------------------------------------------------------------------ */
function buildSkeleton() {
  const s = el('div', 'skel-layer');
  s.innerHTML = `<header class="vhead"><div class="sk line" style="width:220px;height:10px"></div><div class="sk h" style="width:min(640px,80%);height:46px;margin-top:18px"></div><div class="sk line" style="width:min(460px,60%);margin-top:18px"></div></header>
  <div class="grid">
    <div class="glass skel" style="grid-area:lead"><div style="display:flex;justify-content:space-between"><div><div class="sk line" style="width:180px;height:10px"></div><div style="display:flex;gap:6px;margin-top:16px"><div class="sk" style="width:120px;height:24px;border-radius:99px"></div><div class="sk" style="width:110px;height:24px;border-radius:99px"></div></div></div><div class="sk round" style="width:108px;height:108px"></div></div><div class="sk h" style="width:82%;height:38px;margin-top:22px"></div><div class="sk h" style="width:58%;height:38px"></div><div class="sk line" style="width:70%;margin-top:10px"></div><div style="flex:1"></div><div class="sk line" style="width:90%"></div><div class="sk line" style="width:76%"></div><div class="sk line" style="width:100%;height:1px;margin-top:12px"></div><div class="sk line" style="width:40%"></div></div>
    <div class="glass skel" style="grid-area:s1"><div style="display:flex;justify-content:space-between"><div class="sk line" style="width:150px;height:10px"></div><div class="sk" style="width:46px;height:28px"></div></div><div class="sk h" style="width:90%;height:20px"></div><div class="sk h" style="width:64%;height:20px"></div><div style="flex:1"></div><div class="sk line" style="width:50%"></div></div>
    <div class="glass skel" style="grid-area:s2"><div style="display:flex;justify-content:space-between"><div class="sk line" style="width:150px;height:10px"></div><div class="sk" style="width:46px;height:28px"></div></div><div class="sk h" style="width:86%;height:20px"></div><div class="sk h" style="width:52%;height:20px"></div><div style="flex:1"></div><div class="sk line" style="width:46%"></div></div>
    <div class="glass skel" style="grid-area:map;display:grid;grid-template-columns:1.05fr 1fr;gap:26px"><div class="sk" style="border-radius:16px"></div><div style="display:flex;flex-direction:column;gap:10px"><div class="sk line" style="width:60%;height:10px"></div><div class="sk h" style="width:90%;height:20px"></div><div style="flex:1"></div>${'<div class="sk line" style="width:100%"></div>'.repeat(4)}</div></div>
    <div class="glass skel" style="grid-area:wk"><div class="sk line" style="width:40%;height:10px"></div><div class="sk h" style="width:80%;height:20px"></div><div style="flex:1"></div>${'<div class="sk line" style="width:100%;margin-top:14px"></div>'.repeat(3)}</div>
  </div>`;
  return s;
}

function boot() {
  if (!initGL()) init2D();
  document.documentElement.dataset.renderer = gl ? 'webgl2' : 'canvas2d';
  resize();
  addEventListener('resize', () => { resize(); placeGlow(false); });
  placeGlow(false);
  const today = buildToday();
  activeView = today;
  viewsEl.appendChild(today);
  bindTilt(today);

  if (REDUCED) {
    Object.assign(cam, REGION.Today); pinOpacity = pinTarget = 0;
    today.querySelectorAll('.rise').forEach(n => n.style.opacity = 1);
    runScores(today, 0);
    needsFrame = true; schedule();
    return;
  }
  // 1. skeleton (frosted placeholders) over the wide atlas
  const pieces = [...today.querySelectorAll('.piece')];
  pieces.forEach(p => p.style.opacity = 0);
  today.querySelector('.vhead').style.opacity = 0;
  const rail = $('#rail'), ctl = [...document.querySelectorAll('#topctl .piece')];
  const skel = buildSkeleton();
  viewsEl.appendChild(skel);
  rail.animate([{ opacity: 0, translate: '-12px 0', filter: 'blur(10px)' }, { opacity: 1, translate: '0 0', filter: 'blur(0px)' }], { duration: 900, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' });
  ctl.forEach((c, i) => c.animate([{ opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)' }], { duration: 700, delay: 80 + i * 60, easing: 'ease-out', fill: 'backwards' }));
  skel.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, fill: 'backwards' });
  schedule();

  // 2. camera eases in from the whole atlas while glass condenses
  const SK = 420;
  setTimeout(() => {
    flyTo({ ...REGION.Today }, 2200, easeLoad, 0);
    setTimeout(() => { pinTarget = 0; }, 700);
    skel.animate([{ opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(6px)' }], { duration: 380, easing: 'ease-in', fill: 'forwards' }).finished.then(() => skel.remove()).catch(() => skel.remove());
    pieces.forEach(p => p.style.opacity = '');
    today.querySelector('.vhead').style.opacity = '';
    playHeading(today.querySelector('.vhead'), 120);
    const tiles = pieces.filter(p => !p.classList.contains('vhead'));
    condense(tiles, 160, { dur: 1100, stagger: 90, sheen: true });
    runScores(today, 620);
  }, SK);
}
boot();
})();
</script>
