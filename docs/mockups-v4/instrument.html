<!doctype html>
<html lang="en" data-theme="night">
<head>
<title>Instrument · Byline v4</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Byline v4, direction A: Instrument. Graphite, hairlines, electric blue, and a news weather map the day assembles out of.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&display=swap">
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root{
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-serif: "Newsreader", "Iowan Old Style", Georgia, serif;

  --ease: cubic-bezier(.16,1,.3,1);        /* expo out: arrivals */
  --ease-in: cubic-bezier(.7,0,.84,0);     /* expo in: departures */
  --ease-io: cubic-bezier(.65,0,.35,1);

  --r-tile: 10px;
  --r-ctl: 6px;
  --rail-w: 232px;
  --gap: 16px;

  /* Night: true neutral graphite */
  --bg: #131415;
  --rail: #0f1011;
  --surface: #191a1c;
  --surface-2: #1f2023;
  --raise: #26272b;
  --line: rgba(255,255,255,.072);
  --line-2: rgba(255,255,255,.13);
  --line-3: rgba(255,255,255,.2);
  --text: #ececee;
  --text-2: #a2a4aa;
  --text-3: #6d6f76;
  --accent: #3d82ff;
  --accent-text: #74a5ff;
  --accent-soft: rgba(61,130,255,.14);
  --accent-line: rgba(61,130,255,.55);
  --ok: #3ccf91;
  --sk: rgba(255,255,255,.06);
  --sk-shine: rgba(255,255,255,.05);
  --spot: rgba(255,255,255,.035);
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px -18px rgba(0,0,0,.6);
  --dot: 168,172,180;     /* field: neutral dot rgb */
  --hot: 61,130,255;      /* field: hot dot rgb */
  --dot-a: .16;           /* field: base alpha */
  --label: 162,164,170;
  color-scheme: dark;
}
html[data-theme="proof"]{
  --bg: #fbfbfc;
  --rail: #f4f4f5;
  --surface: #ffffff;
  --surface-2: #f7f7f8;
  --raise: #f0f0f2;
  --line: rgba(12,14,18,.085);
  --line-2: rgba(12,14,18,.15);
  --line-3: rgba(12,14,18,.24);
  --text: #0d0e10;
  --text-2: #53565d;
  --text-3: #8b8e95;
  --accent: #0a5cff;
  --accent-text: #0a55ec;
  --accent-soft: rgba(10,92,255,.08);
  --accent-line: rgba(10,92,255,.5);
  --ok: #10a36a;
  --sk: rgba(12,14,18,.06);
  --sk-shine: rgba(255,255,255,.7);
  --spot: rgba(10,92,255,.035);
  --shadow: 0 1px 2px rgba(12,14,18,.04), 0 14px 30px -20px rgba(12,14,18,.18);
  --dot: 92,96,104;
  --hot: 10,92,255;
  --dot-a: .17;
  --label: 83,86,93;
  color-scheme: light;
}

/* ============================================================
   Base
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-feature-settings:"ss01","cv11";
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--font-mono);font-feature-settings:"tnum","zero"}
.serif{font-family:var(--font-serif)}
.eyebrow{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--text-3); line-height:1.4;
}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px;border-radius:4px}
html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after{
  transition: background-color .55s var(--ease-io), border-color .55s var(--ease-io), color .55s var(--ease-io), fill .55s var(--ease-io), stroke .55s var(--ease-io), box-shadow .55s var(--ease-io) !important;
}

#field{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;display:block}

/* ============================================================
   Rail
   ============================================================ */
.rail{
  position:fixed; top:0; left:0; bottom:0; z-index:20; width:var(--rail-w);
  background:var(--rail); border-right:1px solid var(--line);
  display:flex; flex-direction:column; overflow:hidden;
  transition: width .46s var(--ease);
}
.brand{height:56px;display:flex;align-items:center;gap:11px;padding:0 0 0 21px;flex:none}
.brand svg{flex:none}
.brand .word{font-family:var(--font-serif);font-size:20px;font-weight:500;letter-spacing:-.01em;font-variation-settings:"opsz" 36;white-space:nowrap;transition:opacity .25s var(--ease)}
.brand .ver{font-family:var(--font-mono);font-size:10px;color:var(--text-3);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;margin-left:2px;white-space:nowrap;transition:opacity .25s var(--ease)}
.nav{position:relative;padding:10px 10px 0;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-group{font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);padding:14px 12px 6px;white-space:nowrap;transition:opacity .25s var(--ease)}
.nav-ind{
  position:absolute; left:10px; right:10px; top:0; height:34px; border-radius:var(--r-ctl);
  background:var(--surface-2); border:1px solid var(--line);
  transition: transform .5s var(--ease); pointer-events:none;
}
.nav-ind::before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--accent)}
.nav-item{
  position:relative; z-index:1; height:34px; display:flex; align-items:center; gap:12px;
  padding:0 12px; border-radius:var(--r-ctl); color:var(--text-2); white-space:nowrap;
  font-size:13.5px; font-weight:450; letter-spacing:-.003em;
  transition: color .2s;
}
.nav-item svg{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{color:var(--text)}
.nav-item.active{color:var(--text)}
.nav-item.active svg{stroke:var(--accent-text)}
.nav-item .lbl{transition:opacity .22s var(--ease)}
.nav-item .kbd{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);transition:opacity .22s}
.rail-foot{padding:10px;border-top:1px solid var(--line);flex:none}
.rail-foot .nav-item{color:var(--text-3)}
html.collapsed{--rail-w:64px}
html.collapsed .rail .lbl, html.collapsed .rail .kbd, html.collapsed .brand .word, html.collapsed .brand .ver, html.collapsed .nav-group{opacity:0}
html.collapsed .nav-item:hover::after{
  content:attr(data-label); position:fixed; left:70px; transform:translateY(0);
  background:var(--raise); border:1px solid var(--line-2); color:var(--text); font-size:12px;
  padding:4px 8px; border-radius:5px; pointer-events:none; box-shadow:var(--shadow);
}
.collapse-ico{transition:transform .46s var(--ease)}
html.collapsed .collapse-ico{transform:scaleX(-1)}

/* ============================================================
   Main
   ============================================================ */
.main{position:relative;z-index:1;padding-left:var(--rail-w);min-height:100%;transition:padding-left .46s var(--ease)}
.wrap{max-width:1168px;margin:0 auto;padding:0 52px}
.topbar{height:56px;display:flex;align-items:center;gap:16px}
.crumbs{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-3);white-space:nowrap}
.crumbs b{font-weight:500;color:var(--text)}
.crumbs .sep{width:1px;height:12px;background:var(--line-2)}
.topbar .sp{flex:1}
.kpill{display:flex;align-items:center;gap:10px;height:30px;padding:0 6px 0 11px;border:1px solid var(--line);border-radius:var(--r-ctl);color:var(--text-3);font-size:12.5px;background:color-mix(in srgb,var(--surface) 70%,transparent);transition:border-color .2s,color .2s}
.kpill:hover{border-color:var(--line-2);color:var(--text-2)}
.kpill svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.kbdk{font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;color:var(--text-3)}

.theme{position:relative;display:flex;height:30px;padding:2px;border:1px solid var(--line);border-radius:var(--r-ctl);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.theme button{position:relative;z-index:1;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:var(--text-3);border-radius:4px;transition:color .25s}
.theme button[aria-pressed="true"]{color:var(--text)}
.theme button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6}
.theme .thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:4px;background:var(--raise);border:1px solid var(--line);transition:transform .5s var(--ease),width .5s var(--ease)}

.view{position:relative;padding-bottom:56px}

/* ============================================================
   Today: header
   ============================================================ */
.head{padding:18px 0 22px}
.head-top{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:20px}
.h-wrap{position:relative}
.h1{
  font-family:var(--font-serif); font-weight:400; font-size:58px; line-height:1.02; letter-spacing:-.022em;
  font-variation-settings:"opsz" 72; margin:14px 0 0; text-wrap:balance;
}
.h1 .w{display:inline-block;white-space:nowrap}
.h1 .c{display:inline-block;will-change:transform,opacity}
.scan{position:absolute;top:-6px;bottom:-6px;left:0;width:1px;background:var(--accent);opacity:0;pointer-events:none;box-shadow:0 0 12px 1px var(--accent-line)}
.scan::before{content:"";position:absolute;top:0;bottom:0;right:1px;width:120px;background:linear-gradient(90deg,transparent,var(--accent-soft))}
.sub{margin:12px 0 0;font-size:16px;line-height:1.55;color:var(--text-2);max-width:none}
.sub b{color:var(--text);font-weight:500}
.status{display:flex;align-items:center;gap:14px}
.run{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:12px;color:var(--text-2);white-space:nowrap}
.run .live{position:relative;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.run .live::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--ok);opacity:.35}
.run i{font-style:normal;color:var(--text-3)}
.run b{font-weight:500;color:var(--text)}
.runbar{display:flex;gap:3px;align-items:flex-end;height:16px;padding-right:14px;border-right:1px solid var(--line-2)}
.runbar span{display:block;width:3px;border-radius:1px;background:var(--line-3)}
.runbar span.pw{background:var(--accent)}

/* ============================================================
   Tiles
   ============================================================ */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:420px 220px;gap:var(--gap)}
.stack{display:grid;grid-template-rows:1fr 1fr;gap:var(--gap);grid-column:8/13;grid-row:1;min-height:0}
.t-lead{grid-column:1/8;grid-row:1}
.t-map{grid-column:1/6;grid-row:2}
.t-s3{grid-column:6/9;grid-row:2}
.t-week{grid-column:9/13;grid-row:2}

.tile{
  position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-tile);
  box-shadow:var(--shadow); min-height:0; overflow:hidden; isolation:isolate;
  transition: border-color .3s var(--ease), transform .45s var(--ease);
}
.tile::before{
  content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background: radial-gradient(520px circle at var(--mx,50%) var(--my,50%), var(--spot), transparent 42%);
  opacity:0; transition:opacity .4s var(--ease);
}
.tile .hair{position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,var(--accent),transparent 85%);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease);pointer-events:none}
.tile.click{cursor:pointer}
.tile.click:hover{border-color:var(--line-2);transform:translateY(-2px)}
.tile:hover::before{opacity:1}
.tile.click:hover .hair{transform:scaleX(1)}
.glint{position:absolute;inset:-1px;border-radius:inherit;border:1px solid var(--accent);background:linear-gradient(180deg,var(--accent-soft),transparent 60%);box-shadow:0 0 0 1px var(--accent-soft),0 0 24px -6px var(--accent-line);opacity:0;pointer-events:none;z-index:3}
.ti{position:relative;height:100%;display:flex;flex-direction:column;padding:22px 24px 20px}

.t-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.tag{display:inline-flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.tag .sk{overflow:hidden;text-overflow:ellipsis}
.t-top .tag{overflow:hidden}
.tag .pip{width:6px;height:6px;border-radius:1.5px;background:var(--accent)}
.score{display:flex;align-items:baseline;gap:4px;font-family:var(--font-mono);font-feature-settings:"tnum","zero";line-height:1}
.score .n{font-weight:400;letter-spacing:-.04em;color:var(--text)}
.score .of{font-size:11px;color:var(--text-3);letter-spacing:0}

/* gauge: instrument scale 0-100 with threshold tick */
.gauge{position:relative;height:12px}
.gauge .trk{position:absolute;left:0;right:0;top:7px;height:1px;background:var(--line-2)}
.gauge .tks{position:absolute;left:0;right:0;top:4px;height:4px;background:repeating-linear-gradient(90deg,var(--line-3) 0 1px,transparent 1px calc(10% - .1px));opacity:.7}
.gauge .fil{position:absolute;left:0;right:0;top:6px;height:3px;border-radius:2px;background:var(--accent);transform-origin:left;transform:scaleX(var(--v,0))}
.gauge .thr{position:absolute;top:0;width:1px;height:12px;background:var(--text-2)}
.gauge-l{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--text-3);margin-top:7px;position:relative}
.gauge-l .tl{position:absolute;transform:translateX(-50%);color:var(--text-2)}

/* lead */
.t-lead .ti{padding:24px 28px 22px}
.t-lead .score .n{font-size:58px}
.t-lead .score .of{font-size:12px}
.lead-title{font-family:var(--font-serif);font-weight:400;font-size:41px;line-height:1.05;letter-spacing:-.018em;font-variation-settings:"opsz" 60;margin:14px 0 0;max-width:20ch;text-wrap:balance}
.lead-sum{margin:12px 0 0;font-size:15px;line-height:1.55;color:var(--text-2);max-width:58ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.why{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.why p{margin:6px 0 0;font-size:14px;line-height:1.52;color:var(--text);max-width:72ch}
.why p em{font-style:normal;color:var(--accent-text)}
.lead-foot{display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:end;margin-top:16px}
.lead-foot .gw{padding-bottom:4px}
.meta{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--text-3);white-space:nowrap}
.meta b{font-weight:500;color:var(--text-2)}
.meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text-3)}
.open{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);transition:color .2s}
.open .kbdk{transition:border-color .2s,color .2s}
.tile:hover .open{color:var(--accent-text)}
.tile:hover .open .kbdk{border-color:var(--accent-line);color:var(--accent-text)}

/* secondary */
.t-sec .score .n{font-size:30px}
.sec-title{font-family:var(--font-serif);font-weight:400;font-size:23px;line-height:1.18;letter-spacing:-.012em;font-variation-settings:"opsz" 30;margin:12px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sec-foot{margin-top:auto;display:grid;grid-template-columns:1fr 132px;gap:20px;align-items:end}
.t-s3 .score .n{font-size:26px}
.t-s3 .sec-title{font-size:20px;-webkit-line-clamp:4}
.t-s3 .sec-foot{grid-template-columns:1fr;gap:12px}

/* weather tile */
.wx{display:grid;grid-template-columns:160px 1fr;gap:24px;margin-top:12px;flex:1;min-height:0}
.wx svg{width:100%;height:100%;display:block;overflow:visible}
.legend{display:flex;flex-direction:column;justify-content:center;gap:8px}
.lg{display:grid;grid-template-columns:1fr 30px;gap:3px 10px;align-items:center}
.lg .nm{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .v{font-family:var(--font-mono);font-size:11px;color:var(--text-3);text-align:right}
.lg .b{grid-column:1/3;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.lg .b i{display:block;height:100%;background:var(--text-3);transform-origin:left;transform:scaleX(var(--v))}
.lg.hot .nm{color:var(--text)}
.lg.hot .b i{background:var(--accent)}

/* week tile */
.wk{margin-top:10px;display:flex;flex-direction:column}
.wk-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.wk-row:first-child{border-top:0;padding-top:2px}
.wk-d{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--text-2);padding-top:2px}
.wk-d.today{color:var(--accent-text)}
.wk-t{font-size:13.5px;line-height:1.35;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-m{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:11.5px;color:var(--text-3)}
.chip{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;border:1px solid var(--line-2);font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2)}
.chip.draft{border-color:var(--accent-line);color:var(--accent-text);background:var(--accent-soft)}

/* ============================================================
   Skeleton (clone of the real layout; inline spans become bars)
   ============================================================ */
.skel{position:absolute;top:0;left:0;right:0;pointer-events:none;z-index:2}
.skel *{color:transparent!important}
.skel .tile > .ti > *:not([data-sk]), .skel svg, .skel .gauge, .skel .gauge-l, .skel .chip, .skel .runbar, .skel .live, .skel .open, .skel .lg .b, .skel .pip{visibility:hidden}
.skel [data-sk]{visibility:visible}
.skel .sk{
  background:linear-gradient(var(--sk),var(--sk)) 0 52%/100% 64% no-repeat;
  -webkit-box-decoration-break:clone; box-decoration-break:clone; border-radius:4px;
}
.skel .tile::after{
  content:""; position:absolute; inset:0; z-index:4;
  background:linear-gradient(100deg,transparent 30%,var(--sk-shine) 50%,transparent 70%);
  transform:translateX(-100%); animation:shine 1.15s var(--ease-io) infinite;
}
@keyframes shine{to{transform:translateX(100%)}}
.pre .tile, .pre .h1, .pre .sub, .pre .status, .pre .eyebrow-h{opacity:0}

/* ============================================================
   Secondary views
   ============================================================ */
.vhead{padding:34px 0 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.vhead .h1{font-size:48px;max-width:none}
.feed{border-top:1px solid var(--line)}
.row{
  position:relative; display:grid; grid-template-columns:64px 1fr 220px 90px; gap:24px; align-items:center;
  padding:18px 4px; border-bottom:1px solid var(--line); cursor:pointer;
}
.row::before{content:"";position:absolute;inset:0 -12px;border-radius:8px;background:var(--surface);opacity:0;transition:opacity .25s;z-index:-1}
.row:hover::before{opacity:1}
.row .sc{font-family:var(--font-mono);font-size:22px;letter-spacing:-.03em;line-height:1}
.row .sc small{display:block;margin-top:8px}
.row .tt{font-family:var(--font-serif);font-size:20px;line-height:1.25;letter-spacing:-.01em;font-variation-settings:"opsz" 24}
.row .tp{margin-top:6px;font-size:12px;color:var(--text-3)}
.row .src{font-size:12.5px;color:var(--text-3)}
.row .src b{color:var(--text-2);font-weight:500}
.row.below .sc, .row.below .tt{color:var(--text-2)}
.thr-row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.thr-row .ln{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--accent-line) 0 4px,transparent 4px 8px)}
.thr-row .eyebrow{color:var(--accent-text)}
.mini{width:56px}
.mini .gauge{height:8px}
.mini .gauge .trk{top:4px}.mini .gauge .tks{display:none}.mini .gauge .fil{top:3px;height:3px}.mini .gauge .thr{height:8px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-tile);box-shadow:var(--shadow)}

<script>
(function(){
"use strict";
const D = window.BYLINE_DATA;
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EXPO = "cubic-bezier(.16,1,.3,1)";
const EXPO_IN = "cubic-bezier(.7,0,.84,0)";
const isPhone = () => innerWidth <= 760;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ------------------------------------------------------------
   Derived data
   ------------------------------------------------------------ */
const T = D.threshold;
const stories = D.stories.slice().sort((a,b) => b.score - a.score);
const worthy = stories.filter(s => s.score >= T);
const byId = Object.fromEntries(stories.map(s => [s.id, s]));

// Topic heat: score-squared weighted, primary topic counts most.
const heatRaw = Object.fromEntries(D.topics.map(t => [t, 0]));
stories.forEach(s => s.topics.forEach((t, i) => {
  if (t in heatRaw) heatRaw[t] += Math.pow(s.score/100, 2) * [1, .72, .52, .4][Math.min(i,3)];
}));
const hmax = Math.max(...Object.values(heatRaw));
const heat = Object.fromEntries(Object.entries(heatRaw).map(([k,v]) => [k, v/hmax]));
const topicsByHeat = D.topics.slice().sort((a,b) => heat[b] - heat[a]);

// Map layout: normalized positions of topic regions (hand-placed constellation).
const LAYOUT = {
  "Agent orchestration": [.36, .44],
  "Machine learning":    [.66, .30],
  "AI governance":       [.76, .66],
  "Business adoption":   [.17, .74],
  "Evaluation":          [.50, .80],
  "Analytics":           [.90, .20],
  "Product management":  [.12, .26],
  "AI engineering":      [.92, .86]
};

function parseWhy(why){
  const out = {topics:[], watch:[], credible:0, primary:false, research:false, commentary:0, signals:[], post:[], deemph:null};
  why.split(" · ").forEach(seg => {
    seg = seg.trim();
    if (seg.startsWith("Matches ")) {
      seg.slice(8).split(/;\s*/).forEach(p => {
        const m = p.match(/^(.+?)\s*\((.+)\)$/);
        if (m) out.topics.push({name:m[1], terms:m[2].split(/,\s*/)});
      });
    } else if (seg.startsWith("watchlist:")) {
      out.watch = seg.slice(10).split(/,\s+/).map(s => s.trim()).filter(Boolean);
    } else if (/credible independent source/.test(seg)) {
      out.credible = parseInt(seg, 10) || 0;
      out.primary = /primary announcement/.test(seg);
      out.research = /research/.test(seg);
      const c = seg.match(/\+(\d+) commentary/); out.commentary = c ? +c[1] : 0;
    } else if (seg.startsWith("practical signals:")) {
      out.signals = seg.slice(18).split(/,\s*/).map(s => s.trim());
    } else if (seg.startsWith("post-worthy:")) {
      out.post = seg.slice(12).split(/,\s*/).map(s => s.trim());
    } else if (seg.startsWith("de-emphasized")) {
      const m = seg.match(/×([\d.]+)\):\s*(.+?)\s*\((.+)\)/);
      out.deemph = m ? {factor:+m[1], what:m[2]} : {factor:1, what:seg};
    }
  });
  return out;
}
const list = a => a.length <= 1 ? (a[0]||"") : a.slice(0,-1).join(", ") + " and " + a[a.length-1];
const NUM = ["No","One","Two","Three","Four","Five","Six"];
function watchPlain(w){
  if (/^How are teams measuring/i.test(w)) return "how teams measure whether agents pay off";
  return w;
}
function plainWhy(s){
  const p = parseWhy(s.why);
  const parts = [];
  const tps = p.topics.map(t => `<em>${esc(t.name)}</em>`);
  let a = tps.length ? `Hits ${list(tps)}` : "Loosely on-topic";
  const q = p.watch.find(w => /\?$/.test(w));
  const others = p.watch.filter(w => !/\?$/.test(w));
  if (q) a += `, and speaks to your open question on ${esc(watchPlain(q))}`;
  parts.push(a + ".");
  let b = `${NUM[p.credible] || p.credible} credible independent source${p.credible === 1 ? "" : "s"}`;
  if (p.primary) b += p.credible === 1 ? ", the primary announcement" : ", including the primary announcement";
  else if (p.research) b += ", including original research";
  if (p.commentary) b += `, plus ${p.commentary === 1 ? "one" : p.commentary} community take${p.commentary>1?"s":""}`;
  parts.push(b + ".");
  if (p.post.length) parts.push(`Worth a post: ${list(p.post.map(x => x.replace(/^checkable numbers$/,"has checkable numbers").replace(/^testable$/,"it's testable")))}.`);
  if (p.deemph) parts.push(`Discounted ×${p.deemph.factor} as ${esc(p.deemph.what)} news.`);
  if (others.length && !p.post.length) parts.push(`Also tracks ${list(others.map(esc))}.`);
  return parts.join(" ");
}
function shortWhy(s){
  const p = parseWhy(s.why);
  const bits = [];
  bits.push(`${p.credible} independent source${p.credible===1?"":"s"}${p.primary ? " + primary" : ""}`);
  if (p.signals.length) bits.push(p.signals.slice(0,2).join(", "));
  return bits.join(" · ");
}
function composition(s){
  const p = parseWhy(s.why);
  const raw = [
    ["Topic match", p.topics.length * 14],
    ["Watchlist", p.watch.length * 7],
    ["Evidence", p.credible * 9 + (p.primary?5:0) + (p.research?5:0) + p.commentary*2],
    ["Practical signals", p.signals.length * 4],
    ["Post-worthiness", p.post.length * 5]
  ];
  const sum = raw.reduce((a,r) => a + r[1], 0) || 1;
  const rows = raw.map(([k,v]) => [k, Math.round(v/sum * s.score)]);
  const diff = s.score - rows.reduce((a,r) => a + r[1], 0);
  rows.sort((a,b) => b[1]-a[1]); rows[0][1] += diff;
  return {rows, deemph:p.deemph, parsed:p};
}
const fmtTime = iso => { const d = new Date(iso); let h = d.getHours(), m = d.getMinutes(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(m).padStart(2,"0")} ${ap}`; };
const DATE = new Date(D.date + "T12:00:00");
const WEEKDAY = DATE.toLocaleDateString("en-US", {weekday:"long"});
const DAYMON = DATE.toLocaleDateString("en-GB", {day:"numeric", month:"long"});
const uniqDomains = s => Array.from(new Set(s.sources.map(x => x.domain)));

  Search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  Studio:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  Calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  Career:'<rect x="3.5" y="7" width="17" height="13" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3.5 12.5h17"/>',
  Contacts:'<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>',
  Sources:'<circle cx="6" cy="18" r="1.5"/><path d="M4.5 11a8.5 8.5 0 0 1 8.5 8.5M4.5 5A14.5 14.5 0 0 1 19 19.5"/>',
  Runs:'<path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/>',
  Settings:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
  More:'<circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/>'
};
const svg = (name, cls="") => `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true">${ICON[name]||ICON.More}</svg>`;

/* ------------------------------------------------------------
   Field: the news weather map (one Canvas2D)
   ------------------------------------------------------------ */
const Field = (function(){
  const cv = $("#field"), ctx = cv.getContext("2d");
  let W=0, H=0, dpr=1, dots=[], regions=[], raf=0, running=false;
  const NB = 20;
  const st = {
    strength:.28, labels:0,
    cx:-9999, cy:-9999, tx:-9999, ty:-9999, cs:0, ts:0,
    sweep:-1, sweepAmp:0,
    col:null, colFrom:null, colTo:null, colT:1
  };
  const tweens = [], pulses = [];
  let lastMove = 0;

  function readColors(){
    const cs = getComputedStyle(document.documentElement);
    const rgb = v => cs.getPropertyValue(v).split(",").map(n => parseFloat(n));
    return {dot:rgb("--dot"), hot:rgb("--hot"), label:rgb("--label"), a:parseFloat(cs.getPropertyValue("--dot-a")) || .16, light: document.documentElement.dataset.theme === "proof"};
  }
  function regionLeft(){ return isPhone() ? 0 : 232; }
  function layout(){
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const L = regionLeft(), aw = W - L;
    const sc = clamp(Math.min(aw/1200, H/860), .42, 1.3);
    regions = D.topics.map(t => {
      const [nx, ny] = LAYOUT[t] || [.5,.5];
      const h = heat[t];
      return {name:t, heat:h, x: L + nx*aw, y: ny*H, r:(90 + h*230)*sc};
    });
    const sp = isPhone() ? 17 : 21;
    dots = [];
    const ox = ((W % sp) / 2), oy = ((H % sp) / 2);
    for (let y = oy; y < H + sp; y += sp){
      for (let x = ox; x < W + sp; x += sp){
        let h = 0;
        for (const r of regions){
          const dx = x - r.x, dy = y - r.y;
          const g = Math.exp(-(dx*dx + dy*dy) / (2 * r.r * r.r * .36));
          h += r.heat * g;
        }
        // contour quantization makes the regions read like isobars
        const n = .86 + .14 * Math.sin(x*.031 + y*.017) * Math.cos(y*.027 - x*.011);
        h = Math.pow(clamp(h * n, 0, 1), .72);
        dots.push(x, y, h);
      }
    }
  }
  function bucketStyles(c){
    const out = [];
    for (let i = 0; i < NB; i++){
      const t = i / (NB - 1);
      const k = clamp((t - .22) / .62, 0, 1); const kk = k*k*(3-2*k);
      const r = c.dot[0] + (c.hot[0]-c.dot[0])*kk, g = c.dot[1] + (c.hot[1]-c.dot[1])*kk, b = c.dot[2] + (c.hot[2]-c.dot[2])*kk;
      const a = c.a + (c.light ? .6 : .76) * Math.pow(t, 1.25);
      out.push({fill:`rgba(${r|0},${g|0},${b|0},${a.toFixed(3)})`, size: 1.1 + t*2.3});
    }
    return out;
  }
  function mixColors(a, b, t){
    const m = (x,y) => x.map((v,i) => v + (y[i]-v)*t);
    return {dot:m(a.dot,b.dot), hot:m(a.hot,b.hot), label:m(a.label,b.label), a:a.a + (b.a-a.a)*t, light: t > .5 ? b.light : a.light};
  }
  const buckets = Array.from({length:NB}, () => []);
  function draw(now){
    const c = st.col;
    const styles = bucketStyles(c);
    ctx.clearRect(0,0,W,H);
    for (const b of buckets) b.length = 0;
    const S = st.strength, cs = st.cs, cx = st.cx, cy = st.cy;
    const sig2 = 2 * 160 * 160;
    const pl = pulses.map(p => { const a = (now - p.t)/p.d; return {x:p.x, y:p.y, R:a*p.reach, k:Math.max(0, 1-a)}; }).filter(p => p.k > 0);
    const sw = st.sweep, swA = st.sweepAmp;
    for (let i = 0; i < dots.length; i += 3){
      let x = dots[i], y = dots[i+1], h = dots[i+2] * S;
      if (cs > .001){
        const dx = cx - x, dy = cy - y, d2 = dx*dx + dy*dy;
        if (d2 < 260000){
          const f = cs * Math.exp(-d2 / sig2);
          x += dx * f * .2; y += dy * f * .2;  // bend toward the cursor
          h += f * .42;
        }
      }
      for (const p of pl){
        const dx = x - p.x, dy = y - p.y, d = Math.sqrt(dx*dx + dy*dy) - p.R;
        if (d > -60 && d < 60) h += Math.exp(-(d*d)/(2*22*22)) * p.k * .75;
      }
      if (swA > 0){ const d = x - sw; if (d > -140 && d < 140) h += Math.exp(-(d*d)/(2*55*55)) * swA * .55; }
      const bi = Math.min(NB-1, Math.max(0, Math.round(h * (NB-1))));
      buckets[bi].push(x, y);
    }
    for (let b = 0; b < NB; b++){
      const arr = buckets[b]; if (!arr.length) continue;
      const s = styles[b].size, hs = s/2;
      ctx.fillStyle = styles[b].fill;
      ctx.beginPath();
      for (let j = 0; j < arr.length; j += 2) ctx.rect(arr[j]-hs, arr[j+1]-hs, s, s);
      ctx.fill();
    }
    if (st.labels > .01){
      ctx.font = `500 10.5px "Geist Mono", ui-monospace, monospace`;
      ctx.textBaseline = "middle";
      const lc = c.label;
      for (const r of regions){
        const a = st.labels * (.4 + r.heat * .6);
        ctx.fillStyle = `rgba(${lc[0]|0},${lc[1]|0},${lc[2]|0},${a.toFixed(3)})`;
        ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 1;
        // crosshair
        ctx.beginPath(); ctx.moveTo(r.x-5, r.y); ctx.lineTo(r.x+5, r.y); ctx.moveTo(r.x, r.y-5); ctx.lineTo(r.x, r.y+5); ctx.stroke();
        const flip = r.x > W - 200;
        ctx.textAlign = flip ? "right" : "left";
        const lx = flip ? r.x - 12 : r.x + 12;
        ctx.fillText(r.name.toUpperCase(), lx, r.y - 7);
        ctx.fillStyle = `rgba(${c.hot[0]|0},${c.hot[1]|0},${c.hot[2]|0},${(a*.95).toFixed(3)})`;
        ctx.fillText(String(Math.round(r.heat*100)).padStart(3, "0"), lx, r.y + 8);
        ctx.textAlign = "left";
      }
    }
  }
  function tick(now){
    raf = 0;
    let active = false;
    for (let i = tweens.length - 1; i >= 0; i--){
      const tw = tweens[i];
      const t = clamp((now - tw.t0) / tw.d, 0, 1);
      if (t <= 0) { active = true; continue; }
      const e = tw.ease(t);
      st[tw.k] = tw.from + (tw.to - tw.from) * e;
      if (t >= 1) tweens.splice(i, 1); else active = true;
    }
    if (st.colT < 1){
      st.colT = clamp((now - st.colT0) / 520, 0, 1);
      const e = st.colT < .5 ? 2*st.colT*st.colT : 1 - Math.pow(-2*st.colT+2, 2)/2;
      st.col = mixColors(st.colFrom, st.colTo, e);
      active = true;
    }
    if (!RM){
      if (now - lastMove > 5000) st.ts = 0;          // relax the lens after idle
      const k = .14;
      if (st.cx < -5000) { st.cx = st.tx; st.cy = st.ty; }
      st.cx += (st.tx - st.cx) * k; st.cy += (st.ty - st.cy) * k;
      st.cs += (st.ts - st.cs) * .08;
      if (Math.abs(st.tx - st.cx) > .25 || Math.abs(st.ty - st.cy) > .25 || Math.abs(st.ts - st.cs) > .004) active = true;
      else st.cs = st.ts;
    }
    for (let i = pulses.length - 1; i >= 0; i--){ if (now - pulses[i].t > pulses[i].d) pulses.splice(i,1); else active = true; }
    draw(now);
    if (active && running) raf = requestAnimationFrame(tick);   // otherwise freeze: no frames at rest
  }
  function wake(){ if (!running || raf) return; raf = requestAnimationFrame(tick); }
  function tween(k, to, d, delay=0, ease=e => 1 - Math.pow(1-e, 3)){
    for (let i = tweens.length-1; i >= 0; i--) if (tweens[i].k === k) tweens.splice(i,1);
    if (RM) { st[k] = to; wake(); return; }
    tweens.push({k, from:st[k], to, d, t0:performance.now() + delay, ease, _f:false});
    // from-value must be read at start time when delayed
    const tw = tweens[tweens.length-1];
    if (delay) setTimeout(() => { tw.from = st[k]; }, delay);
    wake();
  }
  function pulse(x, y, d=780, reach=240){ if (RM) return; pulses.push({x, y, t:performance.now(), d, reach}); wake(); }
  function sweep(){
    if (RM) return;
    st.sweepAmp = 1; st.sweep = -150;
    tween("sweep", W + 150, 760, 0, e => e<.5 ? 4*e*e*e : 1 - Math.pow(-2*e+2,3)/2);
    tween("sweepAmp", 0, 260, 620);
  }
  function region(name){ return regions.find(r => r.name === name) || regions[0]; }
  function setTheme(){
    const to = readColors();
    if (!st.col || RM){ st.col = to; st.colT = 1; wake(); if (RM) draw(performance.now()); return; }
    st.colFrom = st.col; st.colTo = to; st.colT = 0; st.colT0 = performance.now(); wake();
  }
  function start(){
    layout(); st.col = readColors(); running = true;
    if (RM){ st.strength = .62; draw(performance.now()); return; }
    wake();
    addEventListener("pointermove", e => {
      if (e.pointerType === "touch") return;
      st.tx = e.clientX; st.ty = e.clientY; st.ts = 1; lastMove = performance.now(); wake();
    }, {passive:true});
    document.addEventListener("pointerleave", () => { st.ts = 0; wake(); });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden){ running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
      else { running = true; wake(); }
    });
  }
  let rz;
  addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { layout(); if (RM) draw(performance.now()); else wake(); }, 80); });
  return {start, tween, pulse, sweep, region, setTheme, st, get regions(){ return regions; }};
})();

/* ------------------------------------------------------------
   Motion primitives
   ------------------------------------------------------------ */
// Exponential ease-out count-up: fast start, visibly slows on approach.
function countUp(el, to, {dur=1600, delay=0, gauge=null} = {}){
  if (RM){ el.textContent = to; if (gauge) gauge.style.setProperty("--v", to/100); return; }
  const k = 5.2, norm = 1 - Math.exp(-k);
  el.textContent = "0"; if (gauge) gauge.style.setProperty("--v", 0);
  setTimeout(() => {
    const t0 = performance.now();
    const step = now => {
      const t = clamp((now - t0)/dur, 0, 1);
      const p = (1 - Math.exp(-k*t)) / norm;
      el.textContent = t >= 1 ? to : Math.floor(to * p);
      if (gauge) gauge.style.setProperty("--v", (to * p / 100).toFixed(4));
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, delay);
}

// Split heading into word/char spans (for the scan-lock entrance).
function splitChars(el){
  const text = el.textContent;
  el.setAttribute("aria-label", text);
  el.innerHTML = text.split(" ").map(w => `<span class="w" aria-hidden="true">${Array.from(w).map(c => `<span class="c">${esc(c)}</span>`).join("")}</span>`).join(" ");
}
// Signature heading entrance, "scan-lock": a constant-velocity hairline scans the
// heading; characters ahead of it are faint and spread wide (loose tracking), each
// one snaps into its true position the instant the scanline crosses it.
function scanLock(el, {delay=0, dur=760} = {}){
  if (!el.querySelector(".c")) splitChars(el);
  const chars = $$(".c", el);
  el.style.opacity = "";
  if (RM) return Promise.resolve();
  const wrap = el.closest(".h-wrap") || el.parentElement;
  let scan = wrap.querySelector(".scan");
  if (!scan){ scan = document.createElement("div"); scan.className = "scan"; wrap.appendChild(scan); }
  const hr = el.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  const width = Math.max(...chars.map(c => c.getBoundingClientRect().right)) - hr.left;
  scan.style.left = (hr.left - wr.left) + "px";
  scan.style.top = (hr.top - wr.top - 6) + "px"; scan.style.bottom = "auto"; scan.style.height = (hr.height + 12) + "px";
  scan.animate([
    {transform:"translateX(0)", opacity:0},
    {opacity:1, offset:.06},
    {opacity:1, offset:.94},
    {transform:`translateX(${width}px)`, opacity:0}
  ], {duration:dur, delay, easing:"linear", fill:"both"});
  chars.forEach(c => {
    const x = (c.getBoundingClientRect().left - hr.left) / width;
    const spread = 10 + x * 34;
    c.animate([
      {opacity:.16, transform:`translateX(${spread}px)`},
      {opacity:1, transform:"translateX(0)"}
    ], {duration:520, delay: delay + x*dur*.94, easing:EXPO, fill:"backwards"});
  });
  // the faint, wide-tracked ghost fades in just before the scan
  el.animate([{opacity:0},{opacity:1}], {duration:200, delay:Math.max(0, delay-200), fill:"backwards"});
  return wait(delay + dur + 400);
}
function rise(els, {delay=0, stagger=40, y=14, dur=620} = {}){
  if (RM) return;
  els.forEach((el, i) => el.animate([{opacity:0, transform:`translateY(${y}px)`},{opacity:1, transform:"none"}], {duration:dur, delay:delay + i*stagger, easing:EXPO, fill:"backwards"}));
}

let current = "Today";
function buildNav(){
  const groups = {Today:"Briefing", Studio:"Publish", Career:"Network", Sources:"System"};
  $("#nav").innerHTML = `<span class="nav-ind" id="ind"></span>` + D.nav.map((n, i) =>
    (groups[n] && i ? `<div class="nav-group">${groups[n]}</div>` : (i===0 ? `<div class="nav-group">${groups[n]}</div>` : "")) +
    `<a href="#${n.toLowerCase()}" class="nav-item${n===current?" active":""}" data-tab="${n}" data-label="${n}">${svg(n)}<span class="lbl">${n}</span>${i < 2 ? `<span class="kbd">G ${n[0]}</span>` : ""}</a>`
  ).join("");
  const tabs = ["Today","Feed","Search","Studio"];
  $("#tabbar").innerHTML = tabs.map(n => `<button data-tab="${n}" class="${n===current?"active":""}">${svg(n)}${n}</button>`).join("") + `<button data-more>${svg("More")}More</button>`;
  $("#sheetNav").innerHTML = D.nav.filter(n => !tabs.includes(n)).map(n => `<a href="#${n.toLowerCase()}" class="nav-item" data-tab="${n}">${svg(n)}<span class="lbl">${n}</span></a>`).join("");
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-tab]");
    if (t){ e.preventDefault(); document.documentElement.classList.remove("sheet-on"); go(t.dataset.tab); return; }
    if (e.target.closest("[data-more]")) document.documentElement.classList.add("sheet-on");
    if (e.target.closest("#scrim")) document.documentElement.classList.remove("sheet-on");
  });
  placeInd(false);
}
function placeInd(anim=true){
  const ind = $("#ind"), a = $(`.nav .nav-item[data-tab="${current}"]`);
  if (!ind || !a) return;
  if (!anim) ind.style.transition = "none";
  ind.style.transform = `translateY(${a.offsetTop}px)`;
  if (!anim) { ind.offsetHeight; ind.style.transition = ""; }
  $$(".nav-item[data-tab]").forEach(n => n.classList.toggle("active", n.dataset.tab === current));
  $$("#tabbar [data-tab]").forEach(n => n.classList.toggle("active", n.dataset.tab === current));
}

const gaugeHTML = (score, labels=false) => `
  <div class="gauge" style="--v:${score/100}"><span class="trk"></span><span class="tks"></span><span class="fil"></span><span class="thr" style="left:${T}%"></span></div>

function miniMapSVG(){
  // Same field, miniature: dots sized by heat, region labels for the hottest three.
  const w = 168, h = 150, sp = 9, out = [];
  const regs = D.topics.map(t => ({t, x:LAYOUT[t][0]*w, y:LAYOUT[t][1]*h, r:(10 + heat[t]*38), hh:heat[t]}));
  for (let y = 4; y < h; y += sp) for (let x = 4; x < w; x += sp){
    let v = 0; regs.forEach(r => { const d2 = (x-r.x)**2 + (y-r.y)**2; v += r.hh * Math.exp(-d2/(2*r.r*r.r*.5)); });
    v = clamp(v, 0, 1);
    const s = (0.9 + v*2.6).toFixed(2), hot = v > .45;
    out.push(`<rect x="${(x - s/2).toFixed(1)}" y="${(y - s/2).toFixed(1)}" width="${s}" height="${s}" fill="${hot ? "var(--accent)" : "var(--text-3)"}" opacity="${(hot ? .35 + v*.6 : .25 + v*.9).toFixed(2)}"/>`);
  }
  topicsByHeat.slice(0,1).forEach(t => {
    const r = regs.find(q => q.t === t);
    out.push(`<path d="M${r.x-4} ${r.y}h8M${r.x} ${r.y-4}v8" stroke="var(--text)" stroke-width="1"/>`);
  });
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" aria-label="News weather map">${out.join("")}</svg>`;
}

// Assign each tile a birth region on the map: its story's first topic not already used.
function assignOrigins(root){
  const used = new Set();
  $$(".tile", root).forEach(t => {
    if (t.dataset.origin){ used.add(t.dataset.origin); return; }
  });
  $$(".tile[data-story]", root).forEach(t => {
    const s = byId[t.dataset.story];
    const o = s.topics.find(x => !used.has(x)) || s.topics[0];
    used.add(o); t.dataset.origin = o;
  });
}
function tilesInOrder(root){
  return [".t-lead", ".stack .tile:nth-child(1)", ".stack .tile:nth-child(2)", ".t-map", ".t-s3", ".t-week"].map(s => $(s, root)).filter(Boolean);
}

// Signature: tiles resolve OUT of their hot regions into the grid.
function resolveTiles(tiles, {dur=1000, stagger=90, delay=0} = {}){
  if (RM) return Promise.resolve();
  let end = 0;
  tiles.forEach((el, i) => {
    const r = el.getBoundingClientRect();
    const reg = Field.region(el.dataset.origin);
    const dx = reg.x - (r.left + r.width/2), dy = reg.y - (r.top + r.height/2);
    const s = Math.max(.02, 10 / r.width), sy = Math.max(.02, 10 / r.height);
    const t = delay + i*stagger;
    end = Math.max(end, t + dur);
    setTimeout(() => Field.pulse(reg.x, reg.y), t);
    const a = el.animate([
      {transform:`translate(${dx}px,${dy}px) scale(${s},${sy})`, opacity:0},
      {opacity:1, offset:.12},
      {transform:`translate(${dx*.22}px,${dy*.22}px) scale(${.55},${.55})`, offset:.42},
      {transform:"none", opacity:1}
    ], {duration:dur, delay:t, easing:"cubic-bezier(.3,.7,.1,1)", fill:"both"});
    a.onfinish = () => a.cancel();
    const g = $(".glint", el);
    if (g) g.animate([{opacity:1},{opacity:.85, offset:.35},{opacity:0}], {duration:dur*1.05, delay:t, easing:"ease-out", fill:"backwards"});
    const ti = $(".ti", el);
    ti.animate([{opacity:0, transform:"translateY(10px)"},{opacity:1, transform:"none"}], {duration:640, delay:t + dur*.46, easing:EXPO, fill:"backwards"});
  });
  return wait(end);
}
function collapseTiles(tiles, {dur=460, stagger=30} = {}){
  if (RM) return Promise.resolve();
  tiles.forEach((el, i) => {
    const r = el.getBoundingClientRect();
    const reg = Field.region(el.dataset.origin);
    const dx = reg.x - (r.left + r.width/2), dy = reg.y - (r.top + r.height/2);
    const t = i*stagger;
    setTimeout(() => Field.pulse(reg.x, reg.y, 600, 140), t + dur*.7);
    el.animate([{transform:"none", opacity:1},{opacity:1, offset:.7},{transform:`translate(${dx}px,${dy}px) scale(.02)`, opacity:0}], {duration:dur, delay:t, easing:"cubic-bezier(.5,0,.8,.25)", fill:"forwards"});
    const ti = $(".ti", el); ti.animate([{opacity:1, transform:"none"},{opacity:0, transform:"scale(.96)"}], {duration:dur*.55, delay:t, easing:"ease-in", fill:"forwards"});
    const g = $(".glint", el); if (g) g.animate([{opacity:0},{opacity:1}], {duration:dur*.5, delay:t, fill:"forwards"});
  });
  return wait(tiles.length*stagger + dur);
}

function wireTiles(root){
  $$(".tile", root).forEach(t => {
    t.addEventListener("pointermove", e => {
      const r = t.getBoundingClientRect();
      t.style.setProperty("--mx", (e.clientX - r.left) + "px");
      t.style.setProperty("--my", (e.clientY - r.top) + "px");
    });
    if (t.dataset.story){
      t.tabIndex = 0;
      t.addEventListener("click", () => openDossier(byId[t.dataset.story], t));
      t.addEventListener("keydown", e => { if (e.key === "Enter") openDossier(byId[t.dataset.story], t); });
    }
  });
}
function runCounts(root, baseDelay=0, tiles=null){
  const order = tiles || tilesInOrder(root);
  order.forEach((t, i) => {
    const n = $(".n[data-count]", t); if (!n) return;
    countUp(n, +n.dataset.count, {dur: t.classList.contains("t-lead") ? 1700 : 1300, delay: baseDelay + i*90, gauge: $(".gauge", t)});
  });
  // legend bars and mini gauge fill in step with the counts
  if (!RM) $$(".lg .b i", root).forEach((b, i) => b.animate([{transform:"scaleX(0)"},{transform:`scaleX(${b.style.getPropertyValue("--v")})`}], {duration:1100, delay:baseDelay + 300 + i*60, easing:EXPO, fill:"backwards"}));
}

async function mountToday({first=false} = {}){
  const view = $("#view");
  view.innerHTML = todayHTML();
  const today = $(".today", view);
  assignOrigins(today);
  wireTiles(today);
  const h1 = $(".h1", today);
  const tiles = tilesInOrder(today);

  if (RM){ splitChars(h1); return; }

  if (first){
    // 1) skeleton, shaped exactly like the tiles (a clone with inline bars)
    const sk = today.cloneNode(true);
    sk.classList.add("skel"); sk.setAttribute("aria-hidden", "true");
    today.classList.add("pre");
    view.appendChild(sk);
    splitChars(h1);
    await wait(420);
    // 2) the map heats up, full-bleed, labels on
    sk.animate([{opacity:1},{opacity:0}], {duration:260, easing:"ease-out", fill:"forwards"}).onfinish = () => sk.remove();
    Field.tween("strength", 1.08, 460, 0);
    Field.tween("labels", 1, 360, 40);
    await wait(300);
    today.classList.remove("pre");
    // 3) heading scan-lock and tiles resolving out of hot regions
    const eb = $(".eyebrow-h", today), sub = $(".sub", today), status = $(".status", today);
    rise([eb], {y:6, dur:500});
    scanLock(h1, {delay:60, dur:720});
    rise([sub, status], {delay:520, stagger:90, y:8});
    const done = resolveTiles(tiles, {dur:920, stagger:72, delay:90});
    runCounts(today, 90 + 920*.46, tiles);
    Field.tween("labels", 0, 800, 1150);
    Field.tween("strength", .6, 1200, 1050);
    await done;
  } else {
    splitChars(h1);
    rise([$(".eyebrow-h", today)], {y:6, dur:500});
    scanLock(h1, {delay:40, dur:640});
    rise([$(".sub", today), $(".status", today)], {delay:420, stagger:80, y:8});
    Field.tween("strength", .85, 260);
    Field.tween("strength", .6, 900, 700);
    const done = resolveTiles(tiles, {dur:820, stagger:64, delay:60});
    runCounts(today, 60 + 820*.46, tiles);
    await done;
  }
}
