<!doctype html>
<html lang="en" data-theme="dark">
<head>
<title>Edition · Byline v4</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Byline v4, direction C: Edition. A quiet, luxurious morning briefing whose tiles size themselves by importance.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Instrument+Sans:wght@400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root{
  --serif:"Newsreader", "Iowan Old Style", Georgia, serif;
  --sans:"Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --ease-out:cubic-bezier(.16,1,.3,1);       /* expo-like, silky settle */
  --ease-io:cubic-bezier(.65,0,.35,1);
  --ease-soft:cubic-bezier(.25,.8,.25,1);

  --rail-open:224px;
  --rail-closed:68px;
  --rw:var(--rail-open);
  --radius:4px;
  --gap:14px;

  color-scheme:dark;
  --bg:#0E0F11;
  --rail-bg:#0B0C0E;
  --tile:rgba(22,23,26,.9);
  --tile-solid:#16171A;
  --tile-hi:#1C1E22;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.14);
  --ink:#F1F1F2;
  --ink-2:#A4A6AB;
  --ink-3:#6C6F75;
  --ink-4:#45474C;
  --accent:#4A86FF;
  --accent-ink:#7EA8FF;
  --accent-soft:rgba(74,134,255,.14);
  --skel:rgba(255,255,255,.045);
  --skel-hi:rgba(255,255,255,.09);
  --sheen:rgba(255,255,255,.045);
  --shadow:0 30px 80px -40px rgba(0,0,0,.8);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F7F7F8;
  --rail-bg:#FFFFFF;
  --tile:rgba(255,255,255,.92);
  --tile-solid:#FFFFFF;
  --tile-hi:#FFFFFF;
  --line:rgba(12,13,16,.08);
  --line-2:rgba(12,13,16,.16);
  --ink:#0C0D10;
  --ink-2:#53565C;
  --ink-3:#8A8D93;
  --ink-4:#C4C6CA;
  --accent:#1F5EFF;
  --accent-ink:#1F5EFF;
  --accent-soft:rgba(31,94,255,.09);
  --skel:rgba(12,13,16,.045);
  --skel-hi:rgba(12,13,16,.085);
  --sheen:rgba(31,94,255,.045);
  --shadow:0 30px 70px -45px rgba(20,30,60,.35);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:2px}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:400}

#field{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}

/* ---------- Rail ---------- */
.rail{
  position:fixed;left:0;top:0;bottom:0;z-index:20;width:var(--rw);
  background:var(--rail-bg);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:22px 12px 16px;
  transition:width .56s var(--ease-out), background-color .4s;
  overflow:hidden;
}
.brand{display:flex;align-items:center;gap:12px;height:36px;padding:0 10px;margin-bottom:26px;white-space:nowrap}
.mark{width:22px;height:22px;flex:none;position:relative}
.mark i{position:absolute;left:3px;height:2px;border-radius:1px;background:var(--ink)}
.mark i:nth-child(1){top:6px;width:16px}
.mark i:nth-child(2){top:11px;width:11px;background:var(--accent)}
.mark i:nth-child(3){top:16px;width:6px;opacity:.5}
.wordmark{font-family:var(--serif);font-size:21px;font-variation-settings:"opsz" 36,"wght" 480;letter-spacing:-.015em;transition:opacity .3s, transform .5s var(--ease-out)}
.nav{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:2px}
.nav-ind{position:absolute;left:0;right:0;top:0;height:38px;border-radius:var(--radius);background:var(--accent-soft);pointer-events:none;transition:transform .6s var(--ease-out)}
.nav-ind::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:2px;border-radius:2px;background:var(--accent)}
.nav button{position:relative;display:flex;align-items:center;gap:14px;width:100%;height:38px;padding:0 13px;border-radius:var(--radius);color:var(--ink-2);white-space:nowrap;transition:color .25s}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav svg,.tabbar svg,.sheet svg,.icon{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.nav .lbl{font-size:13.5px;letter-spacing:.005em;transition:opacity .28s, transform .5s var(--ease-out)}
.nav .sep{height:1px;background:var(--line);margin:10px 12px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.next-run{padding:0 13px;white-space:nowrap;transition:opacity .25s}
.next-run b{display:block;font-family:var(--serif);font-weight:400;font-size:15px;color:var(--ink);font-variation-settings:"opsz" 18,"wght" 420;margin-top:3px;letter-spacing:0;text-transform:none}
.collapse{display:flex;align-items:center;gap:14px;height:38px;padding:0 13px;border-radius:var(--radius);color:var(--ink-3);white-space:nowrap}
.collapse:hover{color:var(--ink)}
.collapse svg{transition:transform .56s var(--ease-out)}
.collapsed .collapse svg{transform:rotate(180deg)}
.collapsed .lbl,.collapsed .wordmark,.collapsed .next-run{opacity:0;transform:translateX(-6px);pointer-events:none}
.collapsed .next-run{height:0;overflow:hidden}

/* ---------- Main ---------- */
.main{position:relative;z-index:1;margin-left:var(--rw);padding:26px 44px 40px;min-height:100vh}
.strip{display:flex;align-items:center;justify-content:space-between;height:34px;gap:24px}
.strip-left{display:flex;align-items:center;gap:14px;min-width:0}
.strip-left .eyebrow{white-space:nowrap}
.status{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);letter-spacing:.01em;white-space:nowrap}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.status .sep{color:var(--ink-4)}
.strip-right{display:flex;align-items:center;gap:22px}
.theme{position:relative;display:flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--tile)}
.theme button{position:relative;z-index:1;height:24px;padding:0 12px;font-size:11.5px;letter-spacing:.02em;color:var(--ink-3);transition:color .3s;border-radius:999px}
.theme button[aria-pressed="true"]{color:var(--ink)}
.theme .knob{position:absolute;top:3px;bottom:3px;left:3px;border-radius:999px;background:var(--tile-hi);border:1px solid var(--line-2);transition:transform .55s var(--ease-out), width .55s var(--ease-out)}
.replay{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.replay:hover{color:var(--ink)}

.views{position:relative}
.view[hidden]{display:none}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin:22px 0 26px}
.vtitle{
  margin:0;font-family:var(--serif);font-weight:400;
  font-size:46px;line-height:1.02;letter-spacing:-.024em;
  font-variation-settings:"opsz" 72,"wght" 400;
}
.vtitle em{font-style:italic;font-variation-settings:"opsz" 72,"wght" 360;color:var(--ink-2)}
.vsub{max-width:380px;margin:0 0 5px;color:var(--ink-2);font-size:14px;line-height:1.5}
.vsub b{color:var(--ink);font-weight:500}

/* ---------- Board / tiles ---------- */
.board{position:relative}
.tile{position:absolute;left:0;top:0;cursor:default;contain:layout}
.tile.story{cursor:pointer}
.plate{
  position:absolute;inset:0;border-radius:var(--radius);
  background:var(--tile);border:1px solid var(--line);
  transform-origin:0 0;will-change:transform;
  transition:background-color .5s var(--ease-soft), border-color .5s var(--ease-soft), box-shadow .6s var(--ease-soft);
  overflow:hidden;
}
.plate::after{
  content:"";position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease-soft);
  background:radial-gradient(520px circle at var(--mx,50%) var(--my,50%), var(--sheen), transparent 60%);
}
.tile.story:hover .plate,.tile.story:focus-visible .plate{border-color:var(--line-2);background:var(--tile-hi);box-shadow:var(--shadow)}
.tile.story:hover .plate::after{opacity:1}
.tile.lead .plate{background:linear-gradient(180deg, var(--tile-hi), var(--tile) 60%)}
.tile.lead .plate::before{content:"";position:absolute;left:28px;top:0;width:28px;height:2px;background:var(--accent)}
.skel{position:absolute;inset:0;padding:24px;display:flex;flex-direction:column;gap:12px;pointer-events:none}
.skel i{display:block;height:10px;border-radius:2px;background:linear-gradient(90deg,var(--skel) 0%,var(--skel-hi) 45%,var(--skel) 90%);background-size:200% 100%;animation:shim 1.1s linear infinite}
.skel i:nth-child(1){width:28%;height:8px}
.skel i:nth-child(2){width:86%;height:18px;margin-top:10px}
.skel i:nth-child(3){width:64%;height:18px}
.skel i:nth-child(4){width:40%;margin-top:auto}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.content{position:absolute;inset:0;display:flex;flex-direction:column;padding:var(--pad,22px);overflow:hidden}
.pre .content,.pre .tag{opacity:0}
.eyerow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;min-height:var(--tagh,0px)}
.tile:not(.lead) .eyerow{padding-right:var(--tagw,0px)}
.eyerow .eyebrow{padding-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow .rk{color:var(--ink-2)}
.title{
  margin:14px 0 0;font-family:var(--serif);font-weight:400;
  font-size:var(--ts,24px);line-height:var(--lh,1.08);letter-spacing:var(--tls,-.015em);
  font-variation-settings:"opsz" var(--opsz,48),"wght" var(--tw,420);
  color:var(--ink);text-wrap:pretty;
}
.title .ln{display:block;white-space:nowrap;will-change:transform,opacity,filter}
.spacer{flex:1;min-height:12px}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;font-size:12.5px;color:var(--ink-2)}
.foot .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.foot .meta b{color:var(--ink-2);font-weight:400}
.oneline{color:var(--ink-2);font-size:13px;line-height:1.45;max-width:46ch}

.tag{position:absolute;display:flex;align-items:baseline;gap:4px;pointer-events:none;will-change:transform}
.tag .num{font-family:var(--sans);font-weight:400;font-size:var(--sz,24px);line-height:.82;letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--ink)}
.tag .den{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.tile:not(.lead) .tag{right:var(--pad);top:var(--pad)}
.tile.lead .tag{left:var(--pad);bottom:var(--pad);flex-wrap:wrap;width:190px}
.tile.lead .tag .num{color:var(--ink)}
.bar{flex-basis:100%;position:relative;height:2px;margin-top:16px;background:var(--line-2);border-radius:2px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--accent);transform-origin:0 0;transform:scaleX(0);border-radius:2px}
.bar .tick{position:absolute;top:-5px;bottom:-5px;width:1px;background:var(--ink-3)}
.bar-cap{flex-basis:100%;display:flex;justify-content:space-between;margin-top:9px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.bar-cap b{color:var(--accent-ink);font-weight:400}

.lead-foot{display:grid;grid-template-columns:190px 1fr;gap:36px;align-items:end}
.lead-foot .ph{height:var(--tagblock,104px)}
.why h4{margin:0 0 10px;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between}
.why h4 span:last-child{color:var(--ink-3)}
.why ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.why li{position:relative;padding-left:18px;color:var(--ink-2);font-size:13.5px;line-height:1.45}
.why li::before{content:"";position:absolute;left:0;top:.68em;width:8px;height:1px;background:var(--ink-3)}
.why li b{color:var(--ink);font-weight:500}
.open-hint{position:absolute;right:var(--pad);top:var(--pad);display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);opacity:0;transform:translateX(-6px);transition:opacity .45s var(--ease-soft), transform .6s var(--ease-out)}
.tile.lead:hover .open-hint{opacity:1;transform:none}
.tile.lead:hover .src-count{opacity:0}
.src-count{transition:opacity .3s}

/* weather */
.tile.weather .content,.tile.week .content{padding:22px 24px}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.thead h3{margin:0;font-family:var(--serif);font-weight:400;font-size:19px;letter-spacing:-.01em;font-variation-settings:"opsz" 24,"wght" 440}
.forecast{margin:6px 0 0;font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--ink-2);font-variation-settings:"opsz" 16,"wght" 380;line-height:1.35}
.forecast b{font-weight:inherit;color:var(--ink);font-style:italic}
.wx{position:relative;margin-top:24px;flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.wrow{display:grid;grid-template-columns:150px 1fr 46px;align-items:center;gap:14px;height:17px}
.wname{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variation-settings:"wght" var(--hw,450);color:var(--hc,var(--ink-2))}
.wstrip{position:relative;height:100%}
.wstrip::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.wdot{position:absolute;top:50%;width:var(--d,6px);height:var(--d,6px);margin:calc(var(--d,6px) / -2) 0 0 calc(var(--d,6px) / -2);border-radius:50%;background:var(--ink-4);will-change:transform}
.wdot.hot{background:var(--accent)}
.wdot.cool{background:transparent;border:1px solid var(--ink-3)}
.wcond{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:right}
.wcond.hot{color:var(--accent-ink)}
.wcond.warm{color:var(--ink-2)}
.wthr{position:absolute;top:-4px;bottom:-4px;width:1px;background:repeating-linear-gradient(to bottom,var(--ink-3) 0 2px,transparent 2px 5px);opacity:.7}
.wthr span{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-3px);font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink-3);white-space:nowrap}
.wthr-wrap{position:absolute;inset:0;display:grid;grid-template-columns:150px 1fr 46px;gap:14px;pointer-events:none}
.wthr-wrap > div{position:relative}

/* week */
.wk{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;flex:1;justify-content:space-between}
.wk li > span:nth-child(2){min-width:0}
.wk li{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.wk li:first-child{border-top:0;padding-top:4px}
.wk .day{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.wk .t{display:block;font-family:var(--serif);font-size:15.5px;line-height:1.25;font-variation-settings:"opsz" 18,"wght" 420;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .ch{display:block;margin-top:3px;font-family:var(--sans);font-size:11.5px;color:var(--ink-3)}
.wk .st::before{flex:none}
.wk .st{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.wk .st::before{content:"";width:5px;height:5px;border-radius:50%;border:1px solid var(--ink-3)}
.wk .st.draft{color:var(--ink-2)}
.wk .st.draft::before{background:var(--accent);border-color:var(--accent)}

/* header skeleton */
.hskel{position:absolute;left:0;bottom:6px;width:min(520px,70%);height:30px;border-radius:3px;background:linear-gradient(90deg,var(--skel) 0%,var(--skel-hi) 45%,var(--skel) 90%);background-size:200% 100%;animation:shim 1.1s linear infinite;pointer-events:none}
.vleft{position:relative}

/* ---------- Feed / other views ---------- */
.flist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.frow{position:relative;display:grid;grid-template-columns:44px 64px minmax(0,1fr) 210px 96px;gap:24px;align-items:center;padding:18px 16px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:2px}
.frow::before{content:"";position:absolute;inset:0;background:var(--tile);border-radius:var(--radius);opacity:0;transition:opacity .4s var(--ease-soft);z-index:-1}
.frow:hover::before{opacity:1}
.frow .rk{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.frow .sc{font-family:var(--sans);font-size:22px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--ink)}
.frow.below .sc,.frow.below .ft{color:var(--ink-3)}
.frow .ft{margin:0;font-family:var(--serif);font-weight:400;line-height:1.12;letter-spacing:-.012em;font-variation-settings:"opsz" 48,"wght" var(--tw,420)}
.frow .tp{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .sr{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);text-align:right;text-transform:uppercase}
.fdiv{display:flex;align-items:center;gap:14px;padding:26px 16px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.fdiv::after{content:"";flex:1;height:1px;background:var(--line)}
.fskel{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 16px}
.fskel i{height:12px;border-radius:2px;background:linear-gradient(90deg,var(--skel) 0%,var(--skel-hi) 45%,var(--skel) 90%);background-size:200% 100%;animation:shim 1.1s linear infinite}

.ghost-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:var(--gap)}
.ghost{position:relative;min-height:220px;border:1px solid var(--line);border-radius:var(--radius);background:var(--tile);padding:22px 24px;display:flex;flex-direction:column}
.ghost h3{margin:12px 0 0;font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.15;letter-spacing:-.012em;font-variation-settings:"opsz" 36,"wght" 420}
.ghost p{margin:auto 0 0;color:var(--ink-3);font-size:12.5px}
.ghost .lines{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.ghost .lines i{display:block;height:1px;background:var(--line)}
.searchbox{display:flex;align-items:center;gap:18px;padding:22px 26px;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--tile);margin-bottom:var(--gap)}
.searchbox input{flex:1;background:none;border:0;outline:none;font-family:var(--serif);font-size:30px;font-variation-settings:"opsz" 48,"wght" 380;color:var(--ink);letter-spacing:-.015em;min-width:0}
.searchbox input::placeholder{color:var(--ink-3)}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:3px;padding:2px 6px}
.srclist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.srclist li{display:grid;grid-template-columns:1fr 120px 1fr;gap:24px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line)}
.srclist .d{font-family:var(--mono);font-size:13px;color:var(--ink)}
.srclist .n{font-family:var(--sans);font-size:20px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.srclist .meter{height:2px;background:var(--line);position:relative}
.srclist .meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-3)}
.srclist .meter i.hot{background:var(--accent)}

/* ---------- Dossier ---------- */
.dossier{position:fixed;top:0;bottom:0;right:0;left:var(--rw);z-index:30}
.dossier[hidden]{display:none}
.d-plate{position:absolute;inset:0;background:var(--tile-solid);transform-origin:0 0;border-left:1px solid var(--line)}
.d-scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
.d-inner{max-width:1180px;padding:26px 56px 80px}
.d-bar{display:flex;justify-content:space-between;align-items:center;height:34px}
.d-back{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.d-back:hover{color:var(--ink)}
.d-actions{display:flex;gap:10px}
.btn{height:32px;padding:0 14px;border-radius:var(--radius);border:1px solid var(--line-2);font-size:12.5px;color:var(--ink);display:inline-flex;align-items:center;gap:8px;transition:border-color .3s, background-color .3s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.d-eyebrow{margin-top:44px}
.d-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px;align-items:start;margin-top:16px}
.d-title{margin:0;font-family:var(--serif);font-weight:400;font-size:62px;line-height:1.02;letter-spacing:-.025em;font-variation-settings:"opsz" 72,"wght" 460;transform-origin:0 0}
.d-score{text-align:right;padding-top:6px}
.d-score .num{display:inline-block;font-family:var(--sans);font-size:88px;line-height:.8;letter-spacing:-.05em;font-variant-numeric:tabular-nums;transform-origin:0 0}
.d-score .den{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:4px}
.d-score .cap{margin-top:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.d-summary{margin:28px 0 0;max-width:62ch;font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.42;color:var(--ink-2);font-variation-settings:"opsz" 24,"wght" 360}
.d-meta{display:flex;flex-wrap:wrap;gap:0;margin-top:36px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.d-meta > div{padding:16px 28px 16px 0;margin-right:28px;border-right:1px solid var(--line)}
.d-meta > div:last-child{border-right:0}
.d-meta .v{margin-top:6px;font-size:14px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:2px 10px}
.d-grid{display:grid;grid-template-columns:1.15fr 1fr .95fr;gap:48px;margin-top:44px}
.d-grid h3{margin:0 0 18px;display:flex;justify-content:space-between;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.ev{list-style:none;margin:0;padding:0;counter-reset:ev}
.ev li{counter-increment:ev;display:grid;grid-template-columns:34px 1fr;padding:14px 0;border-top:1px solid var(--line)}
.ev li::before{content:counter(ev,decimal-leading-zero);font-family:var(--mono);font-size:10.5px;color:var(--ink-3);padding-top:4px}
.ev .p{font-family:var(--serif);font-size:17px;line-height:1.38;font-variation-settings:"opsz" 18,"wght" 420;color:var(--ink)}
.ev .k{margin-top:5px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
.src{list-style:none;margin:0;padding:0}
.src li{padding:14px 0;border-top:1px solid var(--line)}
.src .dm{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink-3)}
.src .dm b{font-weight:400;color:var(--accent-ink);letter-spacing:.09em;text-transform:uppercase}
.src .st{margin-top:5px;font-size:13.5px;line-height:1.4;color:var(--ink)}
.bd{display:flex;flex-direction:column}
.bd .row{padding:12px 0;border-top:1px solid var(--line)}
.bd .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.bd .lab b{font-family:var(--sans);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.bd .trk{position:relative;height:3px;margin-top:9px;background:var(--line)}
.bd .trk i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-2);transform-origin:0 0}
.bd .trk i.neg{background:var(--ink-3)}
.bd .total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 0;border-top:1px solid var(--line-2);margin-top:4px}
.bd .total span{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.bd .total b{font-family:var(--sans);font-weight:400;font-size:28px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bd .note{margin-top:10px;font-size:11.5px;color:var(--ink-3)}
.d-fade{will-change:transform,opacity}

/* ---------- Phone ---------- */
.tabbar{display:none}
.sheet{display:none}
@media (max-width:760px){
  :root{--rw:0px !important}
  .rail{display:none}
  .main{margin-left:0;padding:16px 16px 104px}
  .strip{height:auto;align-items:flex-start}
  .strip-left .eyebrow{font-size:10px}
  .strip-left .lg{display:none}
  .src-count,.tile.lead .open-hint{display:none}
  .strip .status{display:none}
  .replay{display:none}
  .mstatus{display:flex !important;margin-top:14px}
  .vhead{flex-direction:column;align-items:flex-start;gap:12px;margin:18px 0 20px}
  .vtitle{font-size:33px}
  .vsub{font-size:13.5px}
  .lead-foot{grid-template-columns:1fr;gap:22px}
  .lead-foot .why{order:-1}
  .tile.lead .tag{width:calc(100% - 2 * var(--pad))}
  .wrow{grid-template-columns:118px 1fr 40px;gap:10px;height:20px}
  .wthr-wrap{grid-template-columns:118px 1fr 40px;gap:10px}
  .wname{font-size:12px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;height:calc(68px + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);background:var(--rail-bg);border-top:1px solid var(--line)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10.5px;color:var(--ink-3);position:relative}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar button[aria-current="page"]::before{content:"";position:absolute;top:-7px;width:22px;height:2px;border-radius:2px;background:var(--accent)}
  .dossier{left:0}
  .d-inner{padding:16px 18px 60px}
  .d-actions .ghostbtn{display:none}
  .d-head{grid-template-columns:1fr;gap:18px}
  .d-score{text-align:left}
  .d-title{font-size:34px}
  .d-summary{font-size:17px}
  .d-meta > div{padding:12px 16px 12px 0;margin-right:16px}
  .d-grid{grid-template-columns:1fr;gap:36px}
  .frow{grid-template-columns:28px 40px minmax(0,1fr);gap:12px;padding:16px 4px}
  .frow .tp,.frow .sr{display:none}
  .frow .sc{font-size:18px}
  .ghost-grid{grid-template-columns:1fr}
  .searchbox input{font-size:22px}
  .srclist li{grid-template-columns:1fr 60px}
  .srclist .meter{display:none}
  .sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--tile-solid);border-top:1px solid var(--line-2);border-radius:10px 10px 0 0;padding:10px 12px calc(84px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .55s var(--ease-out)}
  .sheet:not(.open){visibility:hidden;transition:transform .55s var(--ease-out),visibility 0s .55s}
  .sheet.open{transform:none}
  .sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 10px}
  .sheet button{display:flex;align-items:center;gap:14px;width:100%;height:46px;padding:0 10px;color:var(--ink-2);font-size:15px;border-radius:var(--radius)}
  .sheet button[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
}
.mstatus{display:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
</style>

<body>
<canvas id="field" aria-hidden="true"></canvas>

<nav class="rail" id="rail" aria-label="Primary">
  <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span class="wordmark">Byline</span></div>
  <ul class="nav" id="nav"><li class="nav-ind" id="navInd" aria-hidden="true"></li></ul>
  <div class="rail-foot">
    <div class="next-run eyebrow">Next edition<b id="nextRun">Tomorrow, 7:00 AM</b></div>
    <button class="collapse" id="collapse" aria-label="Collapse navigation" title="Collapse  [">
      <svg viewBox="0 0 20 20" class="icon"><path d="M12 5 7 10l5 5"/></svg><span class="lbl">Collapse</span>
    </button>
  </div>
</nav>

<main class="main" id="main">
  <div class="strip" id="strip">
    <div class="strip-left"><span class="eyebrow" id="edLabel"></span></div>
    <div class="strip-right">
      <div class="status" id="status"></div>
      <button class="replay" id="replay" title="Replay the morning edition">Replay</button>
      <div class="theme" id="theme" role="group" aria-label="Theme">
        <span class="knob" id="knob"></span>
        <button data-t="dark" aria-pressed="true">Night</button>
        <button data-t="light" aria-pressed="false">Proof</button>
      </div>
    </div>
  </div>
  <div class="status mstatus" id="mstatus"></div>
  <div class="views" id="views"></div>
</main>

<div class="dossier" id="dossier" hidden></div>
<nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
<div class="sheet" id="sheet" aria-hidden="true"><div class="grab"></div><div id="sheetList"></div></div>

<script src="data.js"></script>
<script>
(function(){
"use strict";
const D = window.BYLINE_DATA;
if(!D){document.body.insertAdjacentHTML('beforeend','<p style="padding:40px">data.js did not load.</p>');return;}

/* ================= Utilities ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const RM = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = RM.matches;
const isPhone = () => window.innerWidth <= 760;
const EASE = 'cubic-bezier(.16,1,.3,1)';
const EASE_FLIP = 'cubic-bezier(.2,.86,.12,1)';
const WORDS = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve'];
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ================= Data derivations ================= */
const T = D.threshold;
const stories = D.stories.slice().sort((a,b) => b.score - a.score);
const cleared = stories.filter(s => s.score >= T);
const board4 = stories.slice(0, 4);                 // lead + 3 secondary
const lead = board4[0];
const mass = s => Math.pow(2, (s.score - 60) / 5);  // importance -> area

const SIGNAL_PLAIN = {
  'available':'available now','general availability':'generally available','ga':'generally available',
  'enterprise':'built for enterprise','pricing':'pricing published','price':'pricing published',
  'open-source':'open source','benchmark':'benchmarks published','standard':'a formal standard',
  'api':'has an API','customers':'named customers'
};
const POST_PLAIN = {
  'testable':'you can test it','changes a process':'it changes a process',
  'checkable numbers':'the numbers are checkable','challenges a claim':'it challenges a claim'
};
const WATCH_ALIAS = q => /How are teams measuring/i.test(q) ? 'measuring whether agents improve outcomes' : q;

function parseWhy(why){
  const out = {topics:[], keys:{}, watch:[], ind:0, primary:false, research:false, commentary:0, practical:[], post:[], deemph:null};
  why.split(' · ').forEach(p => {
    if(p.startsWith('Matches ')){
      p.slice(8).split('; ').forEach(x => {
        const m = x.match(/^(.*?)\s*\((.*)\)$/);
        const name = m ? m[1] : x;
        out.topics.push(name); out.keys[name] = m ? m[2] : '';
      });
    } else if(p.startsWith('watchlist: ')) out.watch = p.slice(11).split(', ');
    else if(/credible independent source/.test(p)){
      out.ind = parseInt(p, 10) || 0;
      out.primary = /primary announcement/.test(p);
      out.research = /research/.test(p);
      const c = p.match(/\+(\d+) commentary/); out.commentary = c ? +c[1] : 0;
    }
    else if(p.startsWith('practical signals: ')){
      const seen = new Set();
      p.slice(19).split(', ').forEach(s => { const v = SIGNAL_PLAIN[s] || s; if(!seen.has(v)){ seen.add(v); out.practical.push(v);} });
      if(seen.has('generally available')) out.practical = out.practical.filter(v => v !== 'available now');
    }
    else if(p.startsWith('post-worthy: ')) out.post = p.slice(13).split(', ');
    else if(p.startsWith('de-emphasized')){
      const m = p.match(/×([\d.]+)\):\s*(.*?)\s*\(/);
      out.deemph = m ? {mult:+m[1], what:m[2]} : {mult:1, what:'de-emphasized'};
    }
  });
  return out;
}
function joinList(a){ return a.length < 2 ? (a[0]||'') : a.slice(0,-1).join(', ') + ' and ' + a[a.length-1]; }
function evidencePlain(w){
  let s;
  if(w.ind === 0) s = 'No independent source yet' + (w.commentary ? ', commentary only' : '');
  else if(w.ind === 1) s = w.primary ? 'Straight from the primary announcement' : 'One credible independent source';
  else s = WORDS[w.ind] + ' independent sources' + (w.primary ? ', incl. the primary announcement' : w.research ? ', incl. research' : '');
  return s;
}
function whyLines(s, n){
  const w = parseWhy(s.why), lines = [];
  if(w.watch.length) lines.push('On your watchlist: <b>' + esc(WATCH_ALIAS(w.watch[0])) + '</b>');
  else if(w.topics.length) lines.push('Squarely in <b>' + esc(joinList(w.topics)) + '</b>');
  lines.push(esc(evidencePlain(w)) + (w.practical.length ? '; ' + esc(joinList(w.practical.slice(0,2))) : ''));
  if(w.post.length) lines.push('Worth a post: ' + esc(joinList(w.post.slice(0,3).map(p => POST_PLAIN[p] || p))));
  return lines.slice(0, n);
}
function breakdown(s){
  const w = parseWhy(s.why);
  const parts = [
    ['Topic fit', Math.min(w.topics.length, 2) * 9],
    ['Watchlist', w.watch.length * 6],
    ['Evidence', w.ind * 8 + (w.primary ? 6 : 0) + (w.research ? 4 : 0) + w.commentary * 2],
    ['Practical signals', w.practical.length * 3],
    ['Post-worthiness', w.post.length * 4]
  ];
  const raw = parts.reduce((a,p) => a + p[1], 0) || 1;
  const pre = w.deemph ? s.score / w.deemph.mult : s.score;
  let rows = parts.map(p => [p[0], Math.round(p[1] / raw * pre)]);
  let sum = rows.reduce((a,r) => a + r[1], 0);
  rows[0][1] += Math.round(pre) - sum;                 // keep integer total exact
  if(w.deemph) rows.push(['De-emphasis ×' + w.deemph.mult, s.score - Math.round(pre)]);
  return rows;
}
function topicHeat(){
  const heat = {}, dots = {};
  D.topics.forEach(t => { heat[t] = 0; dots[t] = []; });
  D.stories.forEach(s => s.topics.forEach(t => {
    if(!(t in heat)){ heat[t] = 0; dots[t] = []; }
    heat[t] += Math.pow(2, (s.score - 60) / 10);
    dots[t].push(s.score);
  }));
  const max = Math.max(...Object.values(heat)) || 1;
  return Object.keys(heat).map(t => {
    const h = heat[t] / max;
    const cond = h >= .7 ? 'hot' : h >= .4 ? 'warm' : h >= .15 ? 'mild' : 'calm';
    return {t, h, cond, dots: dots[t].sort((a,b)=>a-b)};
  }).sort((a,b) => b.h - a.h);
}
const HEAT = topicHeat();
const domains = s => Array.from(new Set(s.sources.map(x => x.domain)));
const fmtDate = () => { const [y,m,d] = D.date.split('-').map(Number); return new Date(y, m-1, d); };
const dt = fmtDate();
const dayName = dt.toLocaleDateString('en-US',{weekday:'long'});
const dateLong = dt.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
const ranAt = (() => { const t = D.ranAt.split('T')[1].split(':'); let h = +t[0]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + t[1] + ' ' + ap; })();
const fmtSeen = iso => { const d = new Date(iso); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'}) + ' · ' + d.toISOString().slice(11,16) + ' UTC'; };

/* ================= Icons ================= */
const IC = {
  Today:'<circle cx="10" cy="10" r="3.2"/><path d="M10 2.6v1.8M10 15.6v1.8M2.6 10h1.8M15.6 10h1.8M4.8 4.8l1.3 1.3M13.9 13.9l1.3 1.3M4.8 15.2l1.3-1.3M13.9 6.1l1.3-1.3"/>',
  Feed:'<path d="M3.5 5.2h13M3.5 10h13M3.5 14.8h8"/>',
  Search:'<circle cx="9" cy="9" r="5.2"/><path d="m13 13 3.6 3.6"/>',
  Studio:'<path d="M12.6 3.6l3.8 3.8-8.9 8.9H3.7v-3.8z"/><path d="m10.8 5.4 3.8 3.8"/>',
  Calendar:'<rect x="3.2" y="4.2" width="13.6" height="12.6" rx="1.5"/><path d="M3.2 8.2h13.6M7 2.8v2.8M13 2.8v2.8"/>',
  Career:'<rect x="2.8" y="6" width="14.4" height="10.2" rx="1.5"/><path d="M7.2 6V4.4c0-.6.4-1 1-1h3.6c.6 0 1 .4 1 1V6M2.8 10.5h14.4"/>',
  Contacts:'<circle cx="10" cy="7.2" r="3"/><path d="M4 16.5c.8-3 3.2-4.5 6-4.5s5.2 1.5 6 4.5"/>',
  Sources:'<path d="m10 3 7 3.6-7 3.6-7-3.6z"/><path d="m3 10.2 7 3.6 7-3.6M3 13.6l7 3.6 7-3.6"/>',
  Runs:'<path d="M2.8 10h3l2-5 4 10 2-5h3.4"/>',
  Settings:'<path d="M3.8 5.5h7.1M14.5 5.5h1.7M3.8 14.5h1.6M9 14.5h7.2"/><circle cx="12.7" cy="5.5" r="1.8"/><circle cx="7.2" cy="14.5" r="1.8"/>',
  More:'<circle cx="4.5" cy="10" r=".9"/><circle cx="10" cy="10" r=".9"/><circle cx="15.5" cy="10" r=".9"/>'
};
const icon = n => '<svg viewBox="0 0 20 20" aria-hidden="true">' + (IC[n] || IC.More) + '</svg>';

/* ================= State ================= */
const S = {
  view:'Today', theme:'dark', collapsed:false, busy:false,
  tiles:{}, rects:{}, anchor:null, hoverAnchor:null, dossier:null, seqToken:0
};

/* ================= Theme ================= */
function applyTheme(t, fromEl){
  const set = () => {
    S.theme = t;
    document.documentElement.setAttribute('data-theme', t);
    $$('#theme button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
    placeKnob();
    store.set('byline-theme', t);
    Field.theme();
  };
  if(!fromEl || reduced || !document.startViewTransition){ set(); return; }
  const r = fromEl.getBoundingClientRect();
  const x = r.left + r.width/2, y = r.top + r.height/2;
  const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(set);
  vt.ready.then(() => {
    document.documentElement.animate(
      {clipPath:['circle(0px at '+x+'px '+y+'px)','circle('+R+'px at '+x+'px '+y+'px)']},
      {duration:900, easing:'cubic-bezier(.7,0,.2,1)', pseudoElement:'::view-transition-new(root)'}
    );
  }).catch(()=>{});
}
function placeKnob(){
  const b = $('#theme button[aria-pressed="true"]'); if(!b) return;
  const k = $('#knob');
  k.style.width = b.offsetWidth + 'px';
  k.style.transform = 'translateX(' + (b.offsetLeft - 3) + 'px)';
}

/* ================= Shell ================= */
function buildShell(){
  $('#edLabel').innerHTML = '<span class="lg">Edition </span>No. ' + D.issue + ' · ' + dayName.slice(0,3) + '<span class="lg">' + dayName.slice(3) + ',</span> ' + dateLong.replace(/ \d{4}$/, m => '<span class="lg">' + m + '</span>');
  const st = '<span class="dot"></span><span>Ran ' + ranAt + '</span><span class="sep">·</span><span>' + D.storiesScanned + ' scanned</span><span class="sep">·</span><span>' + cleared.length + ' post-worthy</span>';
  $('#status').innerHTML = st; $('#mstatus').innerHTML = st;
  const nav = $('#nav');
  D.nav.forEach((n,i) => {
    if(i === 5){ const s = document.createElement('li'); s.className = 'sep'; s.setAttribute('aria-hidden','true'); nav.appendChild(s); }
    const li = document.createElement('li');
    li.innerHTML = '<button data-view="'+esc(n)+'" title="'+esc(n)+'">' + icon(n) + '<span class="lbl">' + esc(n) + '</span></button>';
    nav.appendChild(li);
  });
  const tb = $('#tabbar');
  ['Today','Feed','Search','Studio'].forEach(n => tb.insertAdjacentHTML('beforeend','<button data-view="'+n+'">'+icon(n)+'<span>'+n+'</span></button>'));
  tb.insertAdjacentHTML('beforeend','<button data-more="1">'+icon('More')+'<span>More</span></button>');

/* ================= Heading entrance: "Optical settle" =================
   The variable serif arrives at a small optical size, light weight and open tracking,
   slightly out of focus, then settles into its display cut (opsz 72), its final weight
   and tight tracking — a focus pull on the type itself. Lines are locked first so the
   morph never re-wraps. */
function lockLines(el){
  if(!el.dataset.text) el.dataset.text = el.textContent;
  const html = el.dataset.html || null;
  const words = el.dataset.text.split(/\s+/);
  el.innerHTML = words.map(w => '<span class="w">' + esc(w) + '</span>').join(' ');
  const lines = []; let top = null;
  $$('.w', el).forEach(s => { const t = s.offsetTop; if(top === null || Math.abs(t - top) > 4){ lines.push([]); top = t; } lines[lines.length-1].push(s.textContent); });
  el.innerHTML = lines.map(l => '<span class="ln">' + esc(l.join(' ')) + '</span>').join('');
  return $$('.ln', el);
}
function settle(el, delay=0, dur=1150){
  if(reduced){ el.animate([{opacity:0},{opacity:1}], {duration:200, delay, fill:'backwards'}); return; }
  const cs = getComputedStyle(el);
  const fvs = cs.fontVariationSettings, ls = cs.letterSpacing;
  const wm = fvs.match(/"wght"\s*([\d.]+)/), wFinal = wm ? +wm[1] : 420;
  const om = fvs.match(/"opsz"\s*([\d.]+)/), oFinal = om ? +om[1] : 72;
  const lines = lockLines(el);
  let done = 0;
  lines.forEach((ln, i) => {
    const a = ln.animate([
      {opacity:0, filter:'blur(9px)', letterSpacing:'0.085em', transform:'translateY(.16em)',
       fontVariationSettings:'"opsz" 8, "wght" ' + Math.max(200, wFinal - 210)},
      {opacity:1, offset:.45},
      {opacity:1, filter:'blur(0px)', letterSpacing:ls, transform:'none',
       fontVariationSettings:'"opsz" ' + oFinal + ', "wght" ' + wFinal}
    ], {duration:dur, delay:delay + i * 90, easing:EASE, fill:'backwards'});
    a.onfinish = () => { if(++done === lines.length && el.isConnected && el.dataset.text){ restoreText(el); } };
  });
}
function restoreText(el){ if(el.dataset.html) el.innerHTML = el.dataset.html; else if(el.dataset.text != null) el.textContent = el.dataset.text; }

/* Score count-up: exponential ease-out, visibly slowing as it approaches the value. */
function countUp(el, to, delay=0, dur=1500, onTick){
  if(reduced){ el.textContent = to; onTick && onTick(1); return; }
  const k = 7;  // steepness of the exponential
  const norm = 1 - Math.exp(-k);
  const start = performance.now() + delay;
  el.textContent = '0';
  const step = now => {
    const t = clamp((now - start) / dur, 0, 1);
    const p = (1 - Math.exp(-k * t)) / norm;
    el.textContent = Math.round(to * p);
    onTick && onTick(p);
    if(t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* Treemap: each split is proportional to mass, so the score literally sets the area. */
function treemap(items, r, gap, out, depth=0){
  if(!items.length) return;
  if(items.length === 1){ out[items[0].key] = r; return; }
  const total = items.reduce((a,i) => a + i.m, 0);
  const f = items[0].m / total;
  // alternate the cut direction by depth: lead | (02 over (03 | 04)) — a stable editorial order
  if(depth % 2 === 0){
    const w1 = Math.round((r.w - gap) * f);
    out[items[0].key] = {x:r.x, y:r.y, w:w1, h:r.h};
    treemap(items.slice(1), {x:r.x + w1 + gap, y:r.y, w:r.w - w1 - gap, h:r.h}, gap, out, depth + 1);
  } else {
    const h1 = Math.round((r.h - gap) * f);
    out[items[0].key] = {x:r.x, y:r.y, w:r.w, h:h1};
    treemap(items.slice(1), {x:r.x, y:r.y + h1 + gap, w:r.w, h:r.h - h1 - gap}, gap, out, depth + 1);
  }
}
const storyKeys = ['lead','s1','s2','s3'];
function measureContent(el, w){
  const c = $('.content', el);
  el.style.width = w + 'px'; el.style.height = 'auto';
  c.style.position = 'relative'; c.style.inset = 'auto';
  const h = c.offsetHeight;
  c.style.position = ''; c.style.inset = '';
  return h;
}
function computeLayout(){
  const board = $('#board');
  const W = board.clientWidth, gap = isPhone() ? 12 : 14;
  const out = {};
  if(!isPhone()){
    const top = board.getBoundingClientRect().top + window.scrollY;
    const rowB = 246;
    const zoneH = clamp(window.innerHeight - top - rowB - gap - 34, 400, 600);
    treemap(storyKeys.map(k => ({key:k, m:mass(S.tiles[k].story)})), {x:0, y:0, w:W, h:zoneH}, gap, out);
    const ww = Math.round((W - gap) * 0.585);
    out.weather = {x:0, y:zoneH + gap, w:ww, h:rowB};
    out.week = {x:ww + gap, y:zoneH + gap, w:W - ww - gap, h:rowB};
    out._h = zoneH + gap + rowB;
  } else {
    let y = 0;
    const maxM = mass(lead);
    storyKeys.forEach(k => {
      const t = S.tiles[k], m = mass(t.story);
      const minH = Math.round(110 + 230 * Math.sqrt(m / maxM));
      const h = Math.max(minH, measureContent(t.el, W));
      out[k] = {x:0, y, w:W, h}; y += h + gap;
    });
    ['weather','week'].forEach(k => { const h = measureContent(S.tiles[k].el, W); out[k] = {x:0, y, w:W, h}; y += h + gap; });
    out._h = y - gap;
  }
  return out;
}
function equalLayout(final){
  // the "unranked" skeleton state: stories in arrival order, all the same size
  const order = storyKeys.slice().sort((a,b) => new Date(S.tiles[a].story.first_seen) - new Date(S.tiles[b].story.first_seen));
  const out = {};
  const gap = isPhone() ? 12 : 14;
  if(!isPhone()){
    const zw = $('#board').clientWidth, zh = final.weather.y - gap;
    const w = (zw - gap) / 2, h = (zh - gap) / 2;
    order.forEach((k,i) => { out[k] = {x:(i % 2) * (w + gap), y:Math.floor(i / 2) * (h + gap), w, h}; });
    out.weather = final.weather; out.week = final.week;
  } else {
    let y = 0; const W = $('#board').clientWidth;
    order.forEach(k => { out[k] = {x:0, y, w:W, h:176}; y += 176 + gap; });
    out.weather = {...final.weather, y}; y += final.weather.h + gap;
    out.week = {...final.week, y};
  }
  return out;
}
function place(key, r){
  const el = S.tiles[key].el;
  el.style.transform = 'translate(' + r.x + 'px,' + r.y + 'px)';
  el.style.width = r.w + 'px'; el.style.height = r.h + 'px';
}
function fitTitle(key){
  const t = S.tiles[key]; if(!t.story) return;
  const title = $('.title', t.el), c = $('.content', t.el);
  restoreText(title);
  let fs = titleBase(t.story.score) * (isPhone() ? (key === 'lead' ? .66 : .82) : 1);
  fs = Math.max(fs, isPhone() ? 19 : 16);
  title.style.setProperty('--ts', fs.toFixed(1) + 'px');
  if(isPhone()) return;
  const min = fs * .55;
  let guard = 0;
  while(c.scrollHeight > c.clientHeight + 1 && fs > min && guard++ < 60){
    fs -= 1; title.style.setProperty('--ts', fs.toFixed(1) + 'px');
  }
}
function layoutBoard(){
  const L = computeLayout();
  Object.keys(S.tiles).forEach(k => place(k, L[k]));
  storyKeys.forEach(fitTitle);
  if(isPhone()){ // heights depend on fitted text: re-measure once
    const L2 = computeLayout(); Object.keys(S.tiles).forEach(k => place(k, L2[k])); S.rects = L2;
  } else S.rects = L;
  $('#board').style.height = S.rects._h + 'px';
  return S.rects;
}

/* ================= The signature: the edition assembles itself ================= */
async function assemble(withSkeleton){
  const token = ++S.seqToken;
  const board = $('#board');
  const title = $('#todayTitle');
  const final = layoutBoard();
  const eq = equalLayout(final);
  Object.values(S.tiles).forEach(t => t.el.classList.add('pre'));
  $$('.skel', board).forEach(s => { s.style.display = ''; s.style.opacity = 1; });

  if(reduced){
    Object.values(S.tiles).forEach(t => { t.el.classList.remove('pre'); $('.skel', t.el).style.display = 'none'; });
    storyKeys.forEach(k => { const t = S.tiles[k]; $('.tag .num', t.el).textContent = t.story.score; const f = $('.fill', t.el); if(f) f.style.transform = 'scaleX(' + t.story.score/100 + ')'; });
    S.anchor = $('.plate', S.tiles.lead.el);
    return;
  }

  // 1. Skeleton: arrival order, equal sizes, shimmering
  Object.keys(S.tiles).forEach(k => place(k, eq[k]));
  board.style.height = Math.max(final._h, (eq.week.y + eq.week.h)) + 'px';
  let hs = null;
  if(withSkeleton){
    title.style.opacity = 0;
    hs = document.createElement('div'); hs.className = 'hskel'; title.parentElement.appendChild(hs);
  }
  S.anchor = board;
  await sleep(withSkeleton ? 420 : 160);
  if(token !== S.seqToken) return;

  // 2. Skeleton dissolves; the type and the scores arrive
  $$('.skel', board).forEach(s => s.animate([{opacity:1},{opacity:0}], {duration:180, easing:'linear', fill:'forwards'}));
  if(hs){ hs.animate([{opacity:1},{opacity:0}], {duration:240, fill:'forwards'}).onfinish = () => hs.remove(); }
  if(withSkeleton){ title.style.opacity = ''; settle(title, 60, 1250); fade($('.vsub'), 420, 900, 8); }
  await sleep(150);
  if(token !== S.seqToken) return;
  $$('.skel', board).forEach(s => { s.style.display = 'none'; });

  // 3. FLIP: every tile grows or shrinks to the area its score earns
  Object.keys(S.tiles).forEach(k => place(k, final[k]));
  board.style.height = final._h + 'px';
  storyKeys.forEach(fitTitle);
  S.anchor = $('.plate', S.tiles.lead.el);
  const order = ['lead','s1','s2','s3','weather','week'];
  order.forEach((k, i) => {
    const t = S.tiles[k], from = eq[k], to = final[k];
    const dur = 1050, delay = i < 4 ? i * 70 : 260 + (i - 4) * 80;
    const plate = $('.plate', t.el), tag = $('.tag', t.el);
    const moved = Math.abs(from.x - to.x) + Math.abs(from.y - to.y) + Math.abs(from.w - to.w) + Math.abs(from.h - to.h) > 1;
    if(moved){
      const tf = 'translate(' + (from.x - to.x) + 'px,' + (from.y - to.y) + 'px) scale(' + (from.w / to.w) + ',' + (from.h / to.h) + ')';
      plate.animate([{transform:tf},{transform:'none'}], {duration:dur, delay, easing:EASE_FLIP, fill:'backwards'});
    }
    if(t.story){
      const isLead = k === 'lead';
      // the score rides the plate's corner (same easing => corner-locked)
      const dx = isLead ? from.x - to.x : (from.x + from.w) - (to.x + to.w);
      const dy = isLead ? (from.y + from.h) - (to.y + to.h) : from.y - to.y;

/* ================= Ambient field (Canvas2D) =================
   Motes gather on an orbit around the lead, lean toward the cursor, and drift almost
   imperceptibly. Paused when the tab is hidden; a single static frame under reduced motion. */
const Field = (() => {
  const cv = $('#field'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, P = [], raf = 0, mouse = null, last = 0, col = null;
  let ax = 0, ay = 0, aw = 300, ah = 300; // smoothed anchor
  function theme(){
    col = S.theme === 'light'
      ? {dot:'28,44,90', glow:'31,94,255', ga:.07, da:.55}
      : {dot:'205,214,235', glow:'74,134,255', ga:.11, da:.75};
    if(reduced) draw(true);
  }
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if(!P.length) seed();
    if(reduced) draw(true);
  }
  function seed(){
    const n = isPhone() ? 54 : 130;
    P = Array.from({length:n}, () => ({
      x:Math.random() * W, y:Math.random() * H, vx:0, vy:0,
      a:Math.random() * Math.PI * 2, w:(Math.random() - .5) * .0011,
      e:.62 + Math.random() * .8, off:10 + Math.random() * 120,
      s:.5 + Math.random() * 1.15, al:.12 + Math.random() * .5, k:.006 + Math.random() * .01,
      ph:Math.random() * 6.28
    }));
  }
  function anchorRect(){
    const el = S.hoverAnchor || S.anchor;
    if(el && el.isConnected){ const r = el.getBoundingClientRect(); if(r.width) return r; }
    return {left:W * .25, top:H * .3, width:W * .5, height:H * .4};
  }
  function draw(stat){
    const r = anchorRect();
    const tx = r.left + r.width / 2, ty = r.top + r.height / 2;
    if(stat){ ax = tx; ay = ty; aw = r.width; ah = r.height; }
    else { ax += (tx - ax) * .06; ay += (ty - ay) * .06; aw += (r.width - aw) * .06; ah += (r.height - ah) * .06; }
    ctx.clearRect(0, 0, W, H);
    // light pooled behind the anchor
    const R = Math.max(aw, ah) * .95 + 120;
    const g = ctx.createRadialGradient(ax, ay, 0, ax, ay, R);
    g.addColorStop(0, 'rgba(' + col.glow + ',' + col.ga + ')');
    g.addColorStop(1, 'rgba(' + col.glow + ',0)');
    ctx.fillStyle = g; ctx.fillRect(ax - R, ay - R, R * 2, R * 2);
    if(mouse){
      const g2 = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 260);
      g2.addColorStop(0, 'rgba(' + col.glow + ',' + (col.ga * .45) + ')');
      g2.addColorStop(1, 'rgba(' + col.glow + ',0)');
      ctx.fillStyle = g2; ctx.fillRect(mouse.x - 260, mouse.y - 260, 520, 520);
    }
    for(const p of P){
      if(!stat) p.a += p.w;
      let gx = ax + Math.cos(p.a) * (aw / 2 * p.e + p.off);
      let gy = ay + Math.sin(p.a) * (ah / 2 * p.e + p.off * .7);
      if(mouse){
        const d = Math.hypot(mouse.x - p.x, mouse.y - p.y);
        const f = Math.exp(-d / 240) * .42;
        gx += (mouse.x - gx) * f; gy += (mouse.y - gy) * f;
      }
      if(stat){ p.x = gx; p.y = gy; }
      else {
        p.vx = (p.vx + (gx - p.x) * p.k) * .88;
        p.vy = (p.vy + (gy - p.y) * p.k) * .88;
        p.x += p.vx; p.y += p.vy;
      }
      ctx.globalAlpha = p.al * col.da;
      ctx.fillStyle = 'rgb(' + col.dot + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function loop(now){
    raf = requestAnimationFrame(loop);
    if(now - last < 15) return; // cap ~60fps on high-refresh displays
    last = now;
    draw(false);
  }
  function start(){ if(reduced){ draw(true); return; } if(!raf) raf = requestAnimationFrame(loop); }
  function stop(){ cancelAnimationFrame(raf); raf = 0; }
  window.addEventListener('pointermove', e => { if(e.pointerType === 'mouse') mouse = {x:e.clientX, y:e.clientY}; if(reduced) draw(true); }, {passive:true});
  document.addEventListener('pointerleave', () => { mouse = null; });
  document.addEventListener('visibilitychange', () => { document.hidden ? stop() : start(); });
  return {theme, resize, start, stop, draw};
})();

/* ================= Boot ================= */
function boot(){
  const q = new URLSearchParams(location.search);
  const t = q.get('theme') || store.get('byline-theme') || 'dark';
  S.theme = t === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', S.theme);
  if(q.has('reduced')) reduced = true;
  S.collapsed = q.has('collapsed') || (store.get('byline-rail') === '1' && !q.has('expanded'));
  if(S.collapsed){ $('#rail').classList.add('collapsed'); document.documentElement.style.setProperty('--rw','var(--rail-closed)'); }
  buildShell();
  $$('#theme button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === S.theme)));
  Field.theme(); Field.resize(); Field.start();
  // Skeleton first, then the edition — waiting (briefly) for the fonts so lines lock correctly.
  const views = $('#views'); views.appendChild(todayView());
  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, sleep(1800)]) : Promise.resolve();
  layoutBoard();
  const eq = equalLayout(S.rects);
  Object.keys(S.tiles).forEach(k => place(k, eq[k]));
  $('#todayTitle').style.opacity = 0;
  const hs = document.createElement('div'); hs.className = 'hskel'; $('#todayTitle').parentElement.appendChild(hs);
  fontsReady.then(() => {
    placeKnob(); markNav();
    hs.remove(); $('#todayTitle').style.opacity = '';
    assemble(true);
    const v = q.get('view'); if(v && D.nav.includes(v) && v !== 'Today') setTimeout(() => go(v), 2200);
    if(q.has('dossier')) setTimeout(() => $('.tile.lead').click(), 2300);
  });
  let rt = 0, lastPhone = isPhone();
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      Field.resize(); placeKnob(); markNav();
      if(S.view === 'Today' && S.tiles.lead && $('#board')){
        if(isPhone() !== lastPhone){ lastPhone = isPhone(); }
        layoutBoard();
      }
    }, 120);
  });
  RM.addEventListener && RM.addEventListener('change', e => { reduced = e.matches; Field.theme(); Field.start(); });
}
boot();
})();
</script>
