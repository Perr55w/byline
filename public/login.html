<!doctype html>
<html lang="en" data-theme="proof"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Byline</title>
<script>
  // Theme before first paint. Stored: 'light' | 'dark' | 'system' (v3) or 'proof' | 'night'. Default Proof.
  (function () { var t = null; try { t = localStorage.getItem('byline-theme'); } catch (e) {}
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var night = t === 'dark' || t === 'night'; document.documentElement.dataset.theme = night ? 'night' : 'proof';
    var m = document.createElement('meta'); m.name = 'theme-color'; m.content = night ? '#121316' : '#F5F6F8'; document.head.appendChild(m); })();
</script>
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<!-- tokens.css is served only to signed-in sessions unless the server lists it as public; every rule below
     therefore carries the Proof token value as its var() fallback (the only literals outside tokens.css). -->
<link rel="stylesheet" href="/css/v4/tokens.css">
<style>
  @font-face { font-family: 'Newsreader'; src: url('/fonts/newsreader.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
  @font-face { font-family: 'Geist'; src: url('/fonts/geist.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg, #F5F6F8); color: var(--text-1, #0C0D10);
    font: 400 15px/23px var(--font-sans, 'Geist', system-ui, sans-serif); -webkit-font-smoothing: antialiased; }
  .login-top { display: flex; align-items: center; justify-content: space-between; padding: max(18px, env(safe-area-inset-top, 0px)) 24px 0; }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .brand img { width: 26px; height: 26px; border-radius: 6.5px; }
  .brand span { font: 560 23px/1 var(--font-serif, 'Newsreader', Georgia, serif); font-variation-settings: 'opsz' 36; letter-spacing: -0.015em; }
  .dateline { color: var(--text-3, #62666F); font: 450 13px/1 var(--font-sans, 'Geist', system-ui, sans-serif); }
  .login-main { flex: 1; display: grid; place-items: center; padding: 28px max(16px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .login-sheet { width: min(400px, 100%); padding: 28px; border-radius: 16px; background: var(--surface, rgba(255,255,255,.92)); border: 1px solid var(--line, rgba(14,18,28,.08));
    box-shadow: var(--shadow-2, 0 1px 2px rgba(14,18,28,.05), 0 12px 32px -14px rgba(16,32,72,.18)); animation: rise 600ms cubic-bezier(.25,.1,.05,1) both; }
  .eyebrow { margin: 0; font: 500 11px/14px var(--font-mono, ui-monospace, monospace); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3, #62666F); }
  h1 { margin: 10px 0 6px; font: 400 40px/44px var(--font-serif, 'Newsreader', Georgia, serif); font-variation-settings: 'opsz' 72; letter-spacing: -0.02em; }
  .lede { margin: 0 0 20px; color: var(--text-2, #4A4E57); font-size: 15px; }
  label.field { display: flex; flex-direction: column; gap: 6px; color: var(--text-2, #4A4E57); font: 500 13px/18px var(--font-sans, 'Geist', system-ui, sans-serif); }
  label.field + label.field { margin-top: 14px; }
  input[type=password], input[type=text]:not(.vh) { height: 40px; padding: 0 12px; border: 1px solid var(--line-2, rgba(14,18,28,.14)); border-radius: 8px; background: var(--surface-solid, #FFFFFF);
    color: var(--text-1, #0C0D10); font: 400 16px/20px var(--font-sans, 'Geist', system-ui, sans-serif); }
  input:focus { outline: none; border-color: var(--accent, #1F5EFF); box-shadow: var(--ctl-ring, 0 0 0 3px rgba(31,94,255,.16)); }
  button.primary { width: 100%; height: 40px; margin-top: 20px; border: 0; border-radius: 8px; background: var(--accent-fill, #1F5EFF); color: var(--on-accent, #FFFFFF);
    font: 500 14px/1 var(--font-sans, 'Geist', system-ui, sans-serif); cursor: pointer; transition: background-color 160ms, transform 240ms cubic-bezier(.25,.1,.05,1); }
  button.primary:hover { background: var(--accent-fill-hover, #3A71FF); }
  button.primary:active { transform: scale(.98); }
  button.primary:focus-visible { outline: none; box-shadow: var(--focus, 0 0 0 2px #F5F6F8, 0 0 0 4px #1F5EFF); }
  button:disabled { opacity: .6; cursor: progress; }
  .vh { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .code-wrap[hidden] { display: none; }
  #code { --ls: .55em; display: block; width: calc(6 * (1ch + var(--ls))); box-sizing: content-box; height: auto; padding: 8px 0 8px calc(var(--ls) / 2); border: 0; border-radius: 0;
    font: 500 28px/1 var(--font-mono, ui-monospace, monospace); letter-spacing: var(--ls); color: var(--text-1, #0C0D10); background-color: transparent; font-variant-numeric: tabular-nums;
    background-image: repeating-linear-gradient(90deg, var(--line-ctl, #8A8F98) 0 1ch, transparent 1ch calc(1ch + var(--ls)));
    background-size: calc(6 * (1ch + var(--ls)) - var(--ls)) 2px; background-repeat: no-repeat; background-position: calc(var(--ls) / 2) 100%; }
  #code::placeholder { color: transparent; }
  #code:focus { box-shadow: none; }
  .code-hint { display: block; margin-top: 6px; color: var(--text-3, #62666F); font-weight: 400; font-size: 12.5px; }
  #msg { min-height: 1.4em; margin: 12px 0 0; color: var(--err, #D93636); font-size: 13.5px; }
  .login-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line, rgba(14,18,28,.08));
    color: var(--text-3, #62666F); font: 450 12px/1.4 var(--font-sans, 'Geist', system-ui, sans-serif); }
  .shake { animation: shake 360ms cubic-bezier(.45,0,.15,1); }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { .login-sheet, .shake { animation: none; } }
</style>
</head>
<body>
  <header class="login-top">
    <span class="brand" aria-label="Byline"><img src="/icons/favicon.svg" alt=""><span>Byline</span></span>
    <span class="dateline" id="dateline"></span>
  </header>
  <main class="login-main">
    <form class="login-sheet" id="f" novalidate>
      <p class="eyebrow">Private workspace</p>
      <h1>Sign in</h1>
      <p class="lede" id="lede">Enter the password set on the server.</p>
      <input class="vh" type="text" name="username" autocomplete="username" value="byline" tabindex="-1" aria-hidden="true">
      <label class="field">Password<input type="password" name="password" id="pw" autocomplete="current-password" autofocus required></label>
      <label class="field code-wrap" id="code-wrap" hidden>Code
        <input id="code" name="code" type="text" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" aria-describedby="code-hint">
        <span class="code-hint" id="code-hint">6 digits from your authenticator app</span>
      </label>
      <button class="primary" type="submit" id="go">Sign in</button>
      <p id="msg" role="alert" aria-live="assertive"></p>
      <div class="login-foot"><span>Byline</span><span id="foot-note">Password</span></div>
    </form>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const form = $('f'), pw = $('pw'), code = $('code'), wrap = $('code-wrap'), msg = $('msg'), go = $('go');
    $('dateline').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

    let busy = false;
    const showCode = (focus) => {
      wrap.hidden = false;
      $('lede').textContent = 'Enter your password and the current code from your authenticator app.';
      $('foot-note').textContent = 'Password + code';
      if (focus) (pw.value ? code : pw).focus();
    };
    fetch('/api/login', { headers: { Accept: 'application/json' } }).then(r => r.json()).then(d => { if (d.totp) showCode(false); }).catch(() => {});

    const fail = (text) => {
      msg.textContent = text;
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    };
    form.addEventListener('animationend', (e) => { if (e.animationName === 'shake') form.classList.remove('shake'); });

    async function submit() {
      if (busy) return;
      if (!pw.value) { fail('Enter your password.'); pw.focus(); return; }
      if (!wrap.hidden && code.value.length !== 6) { fail('Enter all 6 digits.'); code.focus(); return; }
      busy = true; go.disabled = true; go.textContent = 'Signing in…'; msg.textContent = '';
      try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw.value, ...(wrap.hidden ? {} : { code: code.value }) }) });
        if (r.ok) { location.href = '/#/today'; return; }
        const d = await r.json().catch(() => ({}));
        if (d.code_required && wrap.hidden) { showCode(true); msg.textContent = d.error || ''; return; }
        code.value = '';
        fail(d.error || 'Sign-in failed.');
        if (d.code_required) code.focus(); else { pw.focus(); pw.select(); }
      } catch { fail('Couldn’t reach Byline. Check the connection and try again.'); }
      finally { busy = false; go.disabled = false; go.textContent = 'Sign in'; }
    }
    form.addEventListener('submit', (e) => { e.preventDefault(); submit(); });
    code.addEventListener('input', () => {
      const digits = code.value.replace(/\D/g, '').slice(0, 6);
      if (digits !== code.value) code.value = digits;
      if (digits.length === 6 && pw.value) submit();
    });
  </script>
</body></html>
