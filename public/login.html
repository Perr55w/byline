<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Byline</title>
<script>
  // Theme before first paint: 'dark' (Night, default) | 'light' (Proof) | 'system'.
  (() => { let t = 'dark'; try { t = localStorage.getItem('byline-theme') || 'dark'; } catch {}
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; })();
</script>
<link rel="preload" href="/fonts/newsreader-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/martian-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css"><link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1C1A15">
<style>
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .login-band .mast-row { padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: 10px; justify-content: space-between; }
  .login-band .nameplate { font-size: 40px; }
  .login-main { flex: 1; display: grid; place-items: center;
    padding: 28px max(16px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .login-sheet { width: min(400px, 100%); padding: 20px 22px 18px; animation: sheet-in var(--t-base) var(--ease-press) both; }
  .login-sheet h1 { font: italic 700 var(--fs-2xl)/1.05 var(--display); font-variation-settings: 'opsz' 60; letter-spacing: -0.02em; margin: 8px 0 4px; }
  .login-sheet .lede { margin: 0 0 18px; color: var(--ink-2); font-size: var(--fs-sm); }
  .login-sheet label.field + label.field { margin-top: 14px; }
  .login-sheet button.primary { margin-top: 18px; width: 100%; justify-content: center; padding: 11px 13px; }
  .vh { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* One-time code: Martian Mono with six digit guides drawn under the slots. */
  .code-wrap { margin-top: 5px; }
  .code-wrap[hidden] { display: none; }
  #code {
    --ls: .55em;
    display: block; width: calc(6 * (1ch + var(--ls))); box-sizing: content-box; padding: 8px 0 8px calc(var(--ls) / 2);
    font: 500 28px/1 var(--data); letter-spacing: var(--ls); color: var(--ink); text-transform: none;
    border: 0; background-color: transparent;
    background-image: repeating-linear-gradient(90deg, var(--ink-3) 0 1ch, transparent 1ch calc(1ch + var(--ls)));
    background-size: calc(6 * (1ch + var(--ls)) - var(--ls)) 2px; background-repeat: no-repeat;
    background-position: calc(var(--ls) / 2) 100%; background-origin: border-box;
    font-variant-numeric: tabular-nums; caret-color: var(--pencil-red);
  }
  #code::placeholder { color: transparent; }
  #code:focus { outline-offset: 4px; }
  .code-hint { display: block; margin-top: 6px; font: 400 var(--fs-xs)/1.4 var(--body); letter-spacing: 0; text-transform: none; color: var(--ink-3); }

  #msg { min-height: 1.4em; margin: 12px 0 0; font-size: var(--fs-sm); color: var(--pencil-red); }
  .login-foot { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--rule); font: 400 var(--fs-xs)/1.4 var(--data); font-stretch: 75%; letter-spacing: .02em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; gap: 10px; }

  .shake { animation: shake 360ms var(--ease-rule); }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
  @media (prefers-reduced-motion: reduce) {
    .login-sheet { animation: fade 150ms linear both; }
    .shake { animation: none; }
  }
  @media (max-width: 420px) { .login-band .nameplate { font-size: 34px; } .login-sheet { padding: 18px 16px 16px; } }
</style>
</head>
<body>
  <header class="masthead login-band">
    <div class="mast-row">
      <span class="nameplate" aria-label="Byline">Byline</span>
      <span class="dateline" id="dateline"></span>
    </div>
  </header>
  <main class="login-main">
    <form class="card accent login-sheet" id="f" novalidate>
      <span class="kicker">Private workspace</span>
      <h1>Sign in</h1>
      <p class="lede" id="lede">Enter the password set on the server.</p>
      <input class="vh" type="text" name="username" autocomplete="username" value="byline" tabindex="-1" aria-hidden="true">
      <label class="field">Password<input type="password" name="password" id="pw" autocomplete="current-password" autofocus required></label>
      <label class="field code-wrap" id="code-wrap" hidden>Code
        <input id="code" name="code" type="text" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" aria-describedby="code-hint">
        <span class="code-hint" id="code-hint">6 digits from your authenticator app</span>
      </label>
      <button class="primary" type="submit" id="go">Sign in</button>
      <p id="msg" role="alert" aria-live="assertive"></p>
      <div class="login-foot"><span>Byline</span><span id="foot-note">Password</span></div>
    </form>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const form = $('f'), pw = $('pw'), code = $('code'), wrap = $('code-wrap'), msg = $('msg'), go = $('go');
    $('dateline').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    const night = getComputedStyle(document.documentElement).colorScheme === 'dark';
    document.querySelector('meta[name=theme-color]').content = night ? '#1C1A15' : '#1C1A16';

    let busy = false;
    const showCode = (focus) => {
      wrap.hidden = false;
      $('lede').textContent = 'Enter your password and the current code from your authenticator app.';
      $('foot-note').textContent = 'Password + code';
      if (focus) (pw.value ? code : pw).focus();
    };
    fetch('/api/login', { headers: { Accept: 'application/json' } }).then(r => r.json()).then(d => { if (d.totp) showCode(false); }).catch(() => {});

    const fail = (text) => {
      msg.textContent = text;
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    };
    form.addEventListener('animationend', (e) => { if (e.animationName === 'shake') form.classList.remove('shake'); });

    async function submit() {
      if (busy) return;
      if (!pw.value) { fail('Enter your password.'); pw.focus(); return; }
      if (!wrap.hidden && code.value.length !== 6) { fail('Enter all 6 digits.'); code.focus(); return; }
      busy = true; go.disabled = true; go.textContent = 'Signing in…'; msg.textContent = '';
      try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw.value, ...(wrap.hidden ? {} : { code: code.value }) }) });
        if (r.ok) { location.href = '/#/today'; return; }
        const d = await r.json().catch(() => ({}));
        if (d.code_required && wrap.hidden) { showCode(true); msg.textContent = d.error || ''; return; }
        code.value = '';
        fail(d.error || 'Sign-in failed.');
        if (d.code_required) code.focus(); else { pw.focus(); pw.select(); }
      } catch { fail('Couldn’t reach Byline. Check the connection and try again.'); }
      finally { busy = false; go.disabled = false; go.textContent = 'Sign in'; }
    }
    form.addEventListener('submit', (e) => { e.preventDefault(); submit(); });
    code.addEventListener('input', () => {
      const digits = code.value.replace(/\D/g, '').slice(0, 6);
      if (digits !== code.value) code.value = digits;
      if (digits.length === 6 && pw.value) submit();
    });
  </script>
</body></html>
