<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Byline — briefing & media studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231C1A16'/><text x='8' y='24' font-family='Georgia' font-style='italic' font-weight='700' font-size='22' fill='%23F3EEE4'>B</text></svg>">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1C1A16">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script>try { const t = localStorage.getItem('byline-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/career.css">
  <link rel="stylesheet" href="/css/people.css">
  <link rel="stylesheet" href="/css/control.css">
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="mast-row">
        <a class="nameplate" href="#/today" aria-label="Byline — Today">Byline</a>
        <span class="dateline" id="dateline"></span>
        <div class="mast-status" id="rail-foot"></div>
        <button class="theme-toggle" id="theme-toggle" type="button"></button>
      </div>
      <nav class="folios" id="nav" aria-label="Sections"></nav>
      <div class="pressbar" id="pressbar" aria-hidden="true"></div>
    </header>
    <main id="view"></main>
  </div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="/js/app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => {});</script>
</body>
</html>
