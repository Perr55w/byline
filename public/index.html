  <script>
    /* Pre-paint: theme, rail state and theme-color before first frame. Stored values stay backward
       compatible: 'light' | 'dark' (also 'proof' | 'night' | 'system'). Default is Proof. */
    (function () {
      var d = document.documentElement, t = null, c = null;
      try { t = localStorage.getItem('byline-theme'); c = localStorage.getItem('byline-rail'); } catch (e) {}
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var night = t === 'dark' || t === 'night';
      d.dataset.theme = night ? 'night' : 'proof';
      if (c === 'collapsed') d.classList.add('rail-collapsed');
      d.dataset.bg = 'full';
      var m = document.createElement('meta'); m.name = 'theme-color'; m.content = night ? '#121316' : '#F5F6F8'; m.id = 'theme-color-live';
      document.head.appendChild(m);
    })();
  </script>

  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">

            try { if (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) document.querySelector('.cmd-glyph').textContent = '\u2318'; } catch (e) {}</script>
